# Compile le moteur en WebAssembly et assemble la page (dist/index.html).
# - Branche de travail : la page compilée est poussée sur la branche `compile/<branche>` (un seul
#   commit, réécrit à chaque fois), pour être essayée sans entrer dans l'historique du projet.
# - main : la page est publiée sur GitHub Pages, puis le tag `deploye` est déplacé sur le commit publié.
name: Compiler et publier

on:
  push:
    branches-ignore: ["compile/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compiler-${{ github.ref }}
  # Une publication en cours va à son terme.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outils (cible wasm32, binaryen, terser)
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSfL https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_133/bin" >> "$GITHUB_PATH"
          npm install -g terser

      - name: Tests rapides
        run: cargo test --release

      - name: Compilation
        run: |
          wasm-opt --version
          ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: parkimo-${{ github.ref_name }}
          path: dist/index.html

      - name: Page compilée de la branche (compile/<branche>)
        if: github.ref != 'refs/heads/main'
        run: |
          mkdir "$RUNNER_TEMP/compile"
          cp dist/index.html dist/trame.html "$RUNNER_TEMP/compile/"
          cd "$RUNNER_TEMP/compile"
          git init -q -b page
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Page compilée de ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "page:refs/heads/compile/${GITHUB_REF_NAME}"

      - name: Site à publier
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p site/essai site/giration
          cp dist/index.html site/index.html
          # Anciennes pages d'essai des modules, désormais réunis : renvoi vers l'application.
          for d in essai giration; do
            printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=../"><title>Parkimo</title><a href="../">Parkimo</a>\n' > "site/$d/index.html"
          done

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  publier:
    if: github.ref == 'refs/heads/main'
    needs: compiler
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v5

      - uses: actions/checkout@v4

      - name: Déplacer le tag deploye sur le commit publié
        run: |
          git tag -f deploye "$GITHUB_SHA"
          git push -f origin deploye

  # Tests longs (places inclinées sur des parcelles aléatoires) : à part, pour ne pas retarder la page.
  tests-longs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests longs
        run: cargo test --release -- --ignored

# Après chaque déploiement réussi de la page (GitHub Pages), le tag `deploye` est déplacé sur le
# commit publié : il désigne toujours la version en ligne.
name: Tag du déploiement

on:
  workflow_run:
    workflows: ["pages build and deployment", "pages-build-deployment"]
    types: [completed]

permissions:
  contents: write

jobs:
  tag:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Déplacer le tag deploye
        run: |
          git tag -f deploye "${{ github.event.workflow_run.head_sha }}"
          git push -f origin deploye

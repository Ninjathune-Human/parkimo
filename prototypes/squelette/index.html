<style>

<script>
"use strict";
// ============================================================================
// Essai du squelette : une branche est l'axe d'une voie. De chaque côté viennent la demi-chaussée
// puis, si on le veut, une rangée de places (longitudinales, en épi ou perpendiculaires).
// L'enveloppe de toutes les branches est l'emprise du bâtiment. Prototype d'interaction en
// JavaScript, à part du moteur Rust : il sert à juger l'idée, pas à produire un plan.
// Cotes : NF P 91-100, tableau 2 (allée, profondeur de rangée, largeur de place), places de 2,50 m à 90°.
// ============================================================================
const TYPES = {
  aucun: { nom: "Voie", allee: 5.5, prof: 0, pas: 0, angle: 0 },
  "0": { nom: "0°", allee: 3.5, prof: 2.5, pas: 5.0, angle: 0 },
  "45": { nom: "45°", allee: 3.5, prof: 4.8, pas: 2.2 / Math.sin(Math.PI / 4), angle: 45 },
  "60": { nom: "60°", allee: 4.0, prof: 5.15, pas: 2.25 / Math.sin(Math.PI / 3), angle: 60 },
  "90": { nom: "90°", allee: 5.0, prof: 5.0, pas: 2.5, angle: 90 },
};
// Systèmes porteurs (charte, section 5 ; sources en section 14). `travees` : nombre de places entre deux appuis ;
// `section` : côté du poteau ou épaisseur du voile ; `portee` : portée nette à ne pas dépasser. `rang` : l'appui
// tient dans la rangée, entre deux travées, et les places se comptent entre nus ; sinon il est au fond de la rangée
// et rien ne tombe dans le plateau.
const SYSTEMES = {
  poteaux: { nom: "Poteaux", travees: [3, 2], section: 0.4, portee: 10, rang: true },
  voiles: { nom: "Voiles", travees: [3, 2], section: 0.2, portee: 7.5, rang: true, voile: true },
  acier: { nom: "Portée acier", travees: [2], section: 0.2, portee: 16.5 },
  beton: { nom: "Portée béton", travees: [3, 2], section: 0.4, portee: 16.5 },
};
const LARGEURS = [2.5, 2.4, 2.3]; // largeur d'une place à 90°, par ordre de préférence (décision 5)
const RETRAIT = 0.65; // un poteau à 0,65 m de l'allée ne demande aucune surlargeur (NF P 91-100, tab. 3)
const PAS = 2.5, AIMANT = 16; // trame des longueurs (m), rayon d'aimantation (px)
const $ = (s) => document.querySelector(s), cv = $("#plan"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, vue = { s: 6, ox: 0, oy: 0 };
let S = { noeuds: [], branches: [], pn: [], pb: [] }, choix = -1, tracer = false, passe = [], calc = null;
// Deux squelettes superposés, même fonctionnement : les voies (`noeuds`, `branches`) et la structure
// (`pn`, `pb` : un nœud est un poteau, une branche une poutre). `NO` et `BR` désignent celui qu'on modifie.
let calque = 0, NO, BR, choixN = -1; // choixN : poteau choisi
// ---- Rampes, par typologie. Une rampe est une brique posée dans une rangée, comme la rampe « le long des
// allées » du moteur (src/ouvrage/plateau.rs, en_rangee) dont elle reprend le gabarit : une voie de 3,25 m contre
// l'allée (Neufert, sens unique), abordée et quittée en S depuis la voie de l'allée, à 1,50 m de son bord. Chaque
// S est fait de deux arcs de 6,50 m de rayon à l'axe et balaie 2,00 m de part et d'autre : c'est l'épure de
// giration. La rampe prend donc, dans la rangée, sa longueur plus un S à chaque bout (8,46 m) : les places
// y disparaissent, et aucun poteau ne tient dans la voie ni dans les épures. On roule à droite : la rampe d'une
// rangée de droite se parcourt dans le sens de la voie, celle d'une rangée de gauche à rebours.
// Elle garde sa place sur le plan (son centre) ; à chaque calcul elle s'aimante à la rangée la plus proche qui
// peut la recevoir, au pas de 2,50 m. Deux rampes dont les rangées se touchent sont couplées.
// Droite : un étage de 2,80 m à 15 % (Neufert), soit 18,70 m, arrondis à 20 m. Demi-niveau : 1,40 m à 15 %, 10 m.
const RAMPES = { droite: { nom: "Rampe droite", long: 20 }, demi: { nom: "Rampe de demi-niveau", long: 10 } };
const GIR = { r: 6.5, h: 2.0, hs: 1.5, voie: 3.25 }; // rayon à l'axe, demi-largeur balayée en courbe, demi-voie droite, voie de rampe
GIR.dv = GIR.hs + GIR.voie / 2; GIR.phi = Math.acos(1 - GIR.dv / (2 * GIR.r)); GIR.s = 2 * GIR.r * Math.sin(GIR.phi);
let choixR = -1; // rampe choisie
// S de raccord partant de P dans le sens T et se décalant de GIR.dv vers N : son axe et les quadrilatères qu'il balaie.
function raccord(P, T, N) {
  const pts = [], K = 8, pt = (x, y, th) => ({ p: [P[0] + T[0] * x + N[0] * y, P[1] + T[1] * x + N[1] * y], n: [-T[0] * Math.sin(th) + N[0] * Math.cos(th), -T[1] * Math.sin(th) + N[1] * Math.cos(th)] });
  for (let k = 0; k <= K; k++) { const th = GIR.phi * k / K; pts.push(pt(GIR.r * Math.sin(th), GIR.r * (1 - Math.cos(th)), th)); }
  for (let k = K - 1; k >= 0; k--) { const th = GIR.phi * k / K; pts.push(pt(GIR.s - GIR.r * Math.sin(th), GIR.dv - GIR.r * (1 - Math.cos(th)), th)); }
  const bord = (o, e) => [o.p[0] + o.n[0] * e, o.p[1] + o.n[1] * e];
  return { axe: pts.map((o) => o.p), quads: pts.slice(1).map((o, k) => [bord(pts[k], GIR.h), bord(o, GIR.h), bord(o, -GIR.h), bord(pts[k], -GIR.h)]) };
}
function poser(ra, B) {
  const L = RAMPES[ra.type].long; let best = null;
  S.branches.forEach((b, i) => { for (const c of ["g", "d"]) {
    const t = TYPES[b[c]]; if (t.prof < 4) continue;
    const r = repere(b), s = c === "g" ? 1 : -1, h = demi(b), al = (p) => (p[0] - r.A[0]) * r.u[0] + (p[1] - r.A[1]) * r.u[1];
    const a0 = Math.ceil((Math.max(al(B[i].a[c][2]), al(B[i].a[c][3])) + GIR.s) / PAS - 1e-6) * PAS, a1 = Math.floor((Math.min(al(B[i].b[c][2]), al(B[i].b[c][3])) - L - GIR.s) / PAS + 1e-6) * PAS; if (a1 < a0) continue;
    const v = s * ((ra.p[0] - r.A[0]) * -r.u[1] + (ra.p[1] - r.A[1]) * r.u[0]), a = Math.min(a1, Math.max(a0, Math.round((al(ra.p) - L / 2) / PAS) * PAS)), d = Math.hypot(v - (h + t.prof / 2), al(ra.p) - (a + L / 2));
    if (best && d >= best.d) continue;
    const sens = c === "d" ? 1 : -1, T = [r.u[0] * sens, r.u[1] * sens], N = [-r.u[1] * s, r.u[0] * s], R = (x0, x1, y0, y1) => [r.P(x0, s * y0), r.P(x1, s * y0), r.P(x1, s * y1), r.P(x0, s * y1)];
    const bouche = r.P(sens > 0 ? a : a + L, s * (h + GIR.voie / 2)), bout = r.P(sens > 0 ? a + L : a, s * (h + GIR.voie / 2));
    best = { d, i, c, a, L, u: T, q: R(a, a + L, h, h + GIR.voie), corps: R(a, a + L, h, h + t.prof), zone: R(a - GIR.s, a + L + GIR.s, h, h + GIR.voie),
      epures: [raccord([bouche[0] - T[0] * GIR.s - N[0] * GIR.dv, bouche[1] - T[1] * GIR.s - N[1] * GIR.dv], T, N), raccord(bout, T, [-N[0], -N[1]])] };
  } });
  // Aucune rangée assez longue à portée : elle reste où on l'a laissée, à replacer.
  if (best && best.d < 12) return best;
  const q = [[ra.p[0] - L / 2, ra.p[1] - 2.5], [ra.p[0] + L / 2, ra.p[1] - 2.5], [ra.p[0] + L / 2, ra.p[1] + 2.5], [ra.p[0] - L / 2, ra.p[1] + 2.5]];
  return { i: -1, L, hors: true, u: [1, 0], q, corps: q, zone: q, epures: [] };
}
const centre = (q) => [(q[0][0] + q[2][0]) / 2, (q[0][1] + q[2][1]) / 2];
let ficheTrame = true; // calque Poteaux, rien de choisi : la fiche de la trame est ouverte ; un toucher hors du dessin la replie
const dansDessin = (m) => !!calc && [...calc.ch, ...calc.bandes].some((q) => dans(m, q));
function pointer() { S.pn = S.pn || []; S.pb = S.pb || []; NO = calque ? S.pn : S.noeuds; BR = calque ? S.pb : S.branches; }
const versE = (p) => [p[0] * vue.s + vue.ox, -p[1] * vue.s + vue.oy], versM = (x, y) => [(x - vue.ox) / vue.s, (vue.oy - y) / vue.s];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- Géométrie d'une branche : demi-chaussée (la plus large des deux côtés, NF P 91-100 tab. 2 note 6) et rangées.
// Une voie bordée de places d'un seul côté prend l'allée de ces places, pas la largeur d'une voie seule.
function demi(b) { const g = TYPES[b.g], d = TYPES[b.d]; return (g.prof && d.prof ? Math.max(g.allee, d.allee) : g.prof ? g.allee : d.prof ? d.allee : g.allee) / 2; }
function repere(b, N = S.noeuds) {
  const A = N[b.a], B = N[b.b], L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1e-9;
  const u = [(B[0] - A[0]) / L, (B[1] - A[1]) / L], n = [-u[1], u[0]];
  return { A, L, u, n, P: (t, o) => [A[0] + u[0] * t + n[0] * o, A[1] + u[1] * t + n[1] * o] };
}
// Bande piétonne : 0,80 m pris dans la largeur de la voie, d'un côté de l'axe, le long de son bord.
// Elle ne déplace ni la chaussée ni les places.
// Réglage d'une voie : « auto » (le côté est choisi par la logique d'ensemble, voir bandesAuto), « g », « d » ou « aucun ».
let COTE = new Map(); // côté retenu pour les voies en « auto »
const BANDE = 0.8, bandeDe = (b) => (b.pieton === "auto" ? COTE.get(b) || "aucun" : b.pieton || "aucun"), pw = (b, c) => (c === "g" || c === "d") && bandeDe(b) === c ? BANDE : 0;
// ---- Nœuds. Autour d'un nœud, les branches sont prises dans l'ordre ; entre deux voisines s'ouvre un secteur.
// Dans un secteur, les bords de même rang des deux branches (bord de chaussée, bord de bande piétonne, fond de
// rangée) se prolongent jusqu'à leur rencontre : chaussées, bandes et rangées s'y coupent l'une sur l'autre,
// sans recouvrement ni vide. Secteur rentrant (moins de 180°) : la rangée de la branche la plus longue garde le
// coin, l'autre s'arrête sur son fond. Bords parallèles, pointe trop longue ou branche trop courte : chaque
// branche est coupée d'équerre au nœud et une cale ferme le secteur.
// Rend, pour chaque bout de branche et chaque côté, quatre points : bord de chaussée, bord intérieur de la bande
// piétonne (vers l'axe), pied et fond de rangée.
function noeuds() {
  const bouts = S.branches.map(() => ({ a: {}, b: {} })), nd = [], cales = [], coins = [], carrefours = [];
  S.noeuds.forEach((N, k) => {
    const autour = S.branches.map((b, i) => ({ b, i })).filter((x) => x.b.a === k || x.b.b === k).map((x) => { const r = repere(x.b), dep = x.b.a === k, d = dep ? r.u : [-r.u[0], -r.u[1]]; return { b: x.b, i: x.i, L: r.L, d, dep, th: Math.atan2(d[1], d[0]) }; }).sort((x, y) => x.th - y.th);
    if (!autour.length) return;
    const tour = [], sect = autour.map((i, n) => {
      const j = autour[(n + 1) % autour.length]; let ang = j.th - i.th; if (ang <= 1e-9) ang += 2 * Math.PI;
      const ci = i.dep ? "g" : "d", cj = j.dep ? "d" : "g", hi = demi(i.b), hj = demi(j.b);
      const oi = [hi, hi - pw(i.b, ci), hi + TYPES[i.b[ci]].prof], oj = [hj, hj - pw(j.b, cj), hj + TYPES[j.b[cj]].prof]; // bord de chaussée, bord intérieur de bande, fond de rangée
      const ni = [-i.d[1], i.d[0]], nj = [j.d[1], -j.d[0]], det = i.d[0] * j.d[1] - i.d[1] * j.d[0];
      const A = (o) => [N[0] + ni[0] * o, N[1] + ni[1] * o], B = (o) => [N[0] + nj[0] * o, N[1] + nj[1] * o];
      const X = (a, b) => { const p = A(a), q = B(b), t = ((q[0] - p[0]) * j.d[1] - (q[1] - p[1]) * j.d[0]) / det; return [p[0] + t * i.d[0], p[1] + t * i.d[1]]; }; // bord de i à l'écart a, bord de j à l'écart b
      const le = (p, x) => (p[0] - N[0]) * x.d[0] + (p[1] - N[1]) * x.d[1];
      let pi, pj, joint = false;

  const rampe = !calque && choixR >= 0 && calc ? calc.rampes[choixR] : null;
  if (rampe) {
    $("#fiche").hidden = false; $("#f-portee").hidden = $("#f-mur").hidden = $("#f-trame").hidden = $("#f-systeme").hidden = true; $("#b-suppr").hidden = false; for (const l of document.querySelectorAll("#fiche .ligne")) l.hidden = true;
    $("#f-long").textContent = `${RAMPES[S.rampes[choixR].type].nom} · ${rampe.L} m${rampe.hors ? " · à replacer dans une rangée assez longue" : ` · ${(rampe.L + 2 * GIR.s).toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m avec les girations${rampe.couple ? " · couplée" : ""}`}`; return;
  }
  const poteau = calque && choixN >= 0 && NO[choixN], b = BR[choix];
  const libre = !!calque && !b && !poteau && ficheTrame; // rien de choisi dans la structure : la fiche est celle de la trame entière
  $("#fiche").hidden = !b && !poteau && !libre; $("#f-portee").hidden = !poteau; $("#f-mur").hidden = !calque || !!poteau || !b; $("#f-trame").hidden = $("#f-systeme").hidden = !libre; $("#b-suppr").hidden = libre;
  for (const l of document.querySelectorAll("#fiche .ligne")) l.hidden = !!calque;
  if (libre) { const n = calc ? calc.pot.length : 0, nb = (v) => v.toLocaleString("fr-FR", { maximumFractionDigits: 1 }); $("#b-trame").setAttribute("aria-pressed", String(!!S.auto)); for (const x of $("#f-systeme").children) x.setAttribute("aria-pressed", String(x.dataset.s === S.systeme));
    $("#f-long").textContent = (n ? `${n} poteau${n > 1 ? "x" : ""} · portée ${nb(calc.porteeNette)} m sur ${nb(calc.porteeLim)} m` : "Aucun poteau") + (S.auto ? " · suit les voies" : " · à la main"); return; }
  if (poteau) { const n = BR.filter((x) => x.a === choixN || x.b === choixN).length; $("#f-long").textContent = `Poteau · ${n} poutre${n > 1 ? "s" : ""}${calc.conflits.includes(poteau) ? " · dans une voie" : ""}`; return; }
  if (!b) return;
  if (calque) { $("#b-plein").setAttribute("aria-pressed", String(!!b.plein)); $("#f-long").textContent = `${b.plein ? "Travée pleine" : "Poutre"} · portée ${repere(b, NO).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m`; return; }
  for (const seg of document.querySelectorAll("#fiche .seg")) for (const x of seg.children) x.setAttribute("aria-pressed", String((b[seg.dataset.cote] || "aucun") === x.dataset.t));
  const ici = calc ? calc.pl.filter((p) => p.i === choix) : [], n = ici.length, serre = LARGEURS.slice(1).map((w) => [w, ici.filter((p) => p.q.w === w).length]).filter((x) => x[1]).map(([w, k]) => ` · ${k} à ${w.toLocaleString("fr-FR", { minimumFractionDigits: 2 })} m`).join("");
  $("#f-long").textContent = `${repere(b).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m · chaussée ${(2 * demi(b)).toLocaleString("fr-FR")} m · ${n} places${serre}`;
}
$("#fiche").addEventListener("click", (ev) => { const x = ev.target.closest(".seg button"), b = S.branches[choix]; if (!x || !b || calque) return; garder();
  // Une rampe du type touché se pose au milieu de la voie, dans sa première rangée ; on la glisse ensuite où l'on veut.
  if (x.parentElement.dataset.cote === "rampe") { const r = repere(b), c = TYPES[b.g].prof >= 4 ? "g" : "d", s = c === "g" ? 1 : -1; (S.rampes = S.rampes || []).push({ type: x.dataset.t, p: r.P(r.L / 2, s * (demi(b) + TYPES[b[c]].prof / 2)) }); choixR = S.rampes.length - 1; choix = -1; rafraichir(); fiche(); enregistrer(); return; }
  b[x.parentElement.dataset.cote] = x.dataset.t; rafraichir(); fiche(); enregistrer(); });
$("#f-portee").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-p]"); if (!x || choixN < 0) return;
  garder(); S.auto = false; if (!porter(choixN, x.dataset.p)) { passe.pop(); $("#b-annuler").disabled = !passe.length; $("#f-long").textContent = "Aucun poteau en face, à moins de 20 m"; return; }
  rafraichir(); fiche(); enregistrer();
});
$("#b-trame").addEventListener("click", () => { garder(); S.auto = !S.auto; choix = choixN = -1; rafraichir(); fiche(); enregistrer(); });
// Une travée remplie en maçonnerie contrevente le bâtiment dans son sens.
$("#b-plein").addEventListener("click", () => { const b = calque && BR[choix]; if (!b) return; garder(); if (b.plein) delete b.plein; else b.plein = true; rafraichir(); fiche(); enregistrer(); });
$("#b-suppr").addEventListener("click", () => {
  if (!calque && choixR >= 0) { garder(); S.rampes.splice(choixR, 1); choixR = -1; rafraichir(); fiche(); enregistrer(); return; }
  // Un poteau part avec ses poutres.
  if (calque && (choixN >= 0 || choix >= 0)) { garder(); S.auto = false; }
  if (calque && choixN >= 0) { const r = BR.filter((b) => b.a !== choixN && b.b !== choixN); BR.length = 0; BR.push(...r); NO[choixN] = null; choixN = -1; rafraichir(); fiche(); enregistrer(); return; }
  if (choix < 0) return; if (!calque) garder(); BR.splice(choix, 1); choix = -1; rafraichir(); fiche(); enregistrer(); });
$("#b-tracer").addEventListener("click", () => { tracer = !tracer; $("#b-tracer").setAttribute("aria-pressed", String(tracer)); cv.style.cursor = tracer ? "crosshair" : "grab"; aide(); });
function aide() {
  $("#aide").textContent = calque
    ? (tracer ? "Touchez pour poser un poteau · tirez pour tracer une poutre" : "Glissez un poteau : il s'aimante aux lignes des places · touchez-le pour porter ses poutres")
    : (tracer ? "Tirez un trait : il s'aimante aux nœuds, aux branches et à la trame" : "Glissez un nœud ou une branche · touchez une branche pour la régler");
}
$("#calques").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-c]"); if (!x) return;
  calque = +x.dataset.c; choix = choixN = choixR = -1; ficheTrame = true; pointer(); aide(); for (const y of $("#calques").children) y.setAttribute("aria-pressed", String(y === x)); fiche(); rafraichir(false);
});
$("#b-annuler").addEventListener("click", annuler); $("#b-cadrer").addEventListener("click", cadrer);
addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") { ev.preventDefault(); annuler(); } });

// ---- Départ : le dernier essai, sinon une boucle avec une antenne.
try { const s = JSON.parse(localStorage.getItem("parkimo.squelette.5") || "null"); if (s && s.noeuds && s.branches) S = s; } catch (e) { /* stockage indisponible */ }
const neuf = !S.branches.length;
// Essai enregistré avant la logique d'ensemble : ses bandes posées à la main ou absentes passent en « auto ».
if (!S.v) { for (const b of S.branches) if (b.pieton !== "aucun") b.pieton = "auto"; S.v = 2; }
if (neuf) S = { noeuds: [[0, 0], [60, 0], [60, 15], [0, 15], [90, 0]], branches: [{ a: 0, b: 1, g: "90", d: "90", pieton: "auto" }, { a: 1, b: 2, g: "aucun", d: "90", pieton: "auto" }, { a: 2, b: 3, g: "90", d: "90", pieton: "auto" }, { a: 3, b: 0, g: "aucun", d: "90", pieton: "auto" }, { a: 1, b: 4, g: "60", d: "45", pieton: "auto" }], pn: [], pb: [] };
if (!SYSTEMES[S.systeme]) S.systeme = "beton"; // par défaut la grande portée béton : aucun appui dans le plateau
if (S.auto === undefined) S.auto = true; // un essai enregistré avant la trame automatique la reçoit
pointer();
new ResizeObserver(taille).observe(cv); taille(); calculer();
// Structure de l'exemple : la trame automatique, et des travées pleines qui contreventent dans les deux sens.
if (neuf) { const x0 = Math.min(...S.pn.map((p) => p[0])), y0 = Math.min(...S.pn.map((p) => p[1])); for (const b of S.pb) { const A = S.pn[b.a], B = S.pn[b.b]; if ((A[0] === x0 && B[0] === x0 && Math.min(A[1], B[1]) >= 2.5 && Math.max(A[1], B[1]) <= 17.5) || (A[1] === y0 && B[1] === y0 && Math.max(A[0], B[0]) <= 2.5)) b.plein = true; } calculer(); }
cadrer();
</script>

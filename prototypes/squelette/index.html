<!doctype html>

<style>

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

.verre { background: var(--verre); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border: 1px solid var(--trait); box-shadow: 0 8px 28px rgba(0,0,0,.10); }
#bilan { position: fixed; left: max(16px, env(safe-area-inset-left)); top: calc(16px + env(safe-area-inset-top)); border-radius: 20px; padding: 12px 16px; min-width: 190px; }

</head>
<body>
<canvas id="plan" aria-label="Squelette du parc"></canvas>
<section id="bilan" class="verre" aria-live="polite">
  <h1>Essai du squelette</h1>
  <div class="n"><span id="s-places">0</span><small>places</small></div>
  <dl><dt>Emprise</dt><dd id="s-emprise">–</dd><dt>Par place</dt><dd id="s-ratio">–</dd><dt>Branches</dt><dd id="s-branches">0</dd><dt>Structure</dt><dd id="s-structure">–</dd></dl>
</section>
<div id="aide" class="verre">Glissez un nœud ou une branche · touchez une branche pour la régler</div>
<section id="fiche" class="verre" hidden aria-label="Branche choisie">
  <div class="ligne"><span>Gauche</span><div class="seg" data-cote="g"></div></div>
  <div class="ligne"><span>Droite</span><div class="seg" data-cote="d"></div></div>
  <div id="f-portee" hidden><button data-p="long">Poutres le long de la voie</button><button data-p="travers">Poutres en travers</button></div>
  <div class="bas"><span id="f-long"></span><button id="b-suppr">Supprimer</button></div>
</section>
<nav id="barre" class="verre">
  <div class="seg" id="calques" role="group" aria-label="Squelette à modifier"><button data-c="0" aria-pressed="true">Voies</button><button data-c="1" aria-pressed="false">Poteaux</button></div>
  <button id="b-tracer" aria-pressed="false">Tracer</button>
  <button id="b-annuler" disabled>Annuler</button>
  <button id="b-cadrer">Cadrer</button>
</nav>
<script>
"use strict";
// ============================================================================
// Essai du squelette : une branche est l'axe d'une voie. De chaque côté viennent la demi-chaussée
// puis, si on le veut, une rangée de places (longitudinales, en épi ou perpendiculaires).
// L'enveloppe de toutes les branches est l'emprise du bâtiment. Prototype d'interaction en
// JavaScript, à part du moteur Rust : il sert à juger l'idée, pas à produire un plan.
// Cotes : NF P 91-100, tableau 2 (allée, profondeur de rangée, largeur de place), places de 2,50 m à 90°.
// ============================================================================
const TYPES = {
  aucun: { nom: "Voie", allee: 5.5, prof: 0, pas: 0, angle: 0 },
  "0": { nom: "0°", allee: 3.5, prof: 2.5, pas: 5.0, angle: 0 },
  "45": { nom: "45°", allee: 3.5, prof: 4.8, pas: 2.2 / Math.sin(Math.PI / 4), angle: 45 },
  "60": { nom: "60°", allee: 4.0, prof: 5.15, pas: 2.25 / Math.sin(Math.PI / 3), angle: 60 },
  "90": { nom: "90°", allee: 5.0, prof: 5.0, pas: 2.5, angle: 90 },
};
const PAS = 2.5, AIMANT = 16; // trame des longueurs (m), rayon d'aimantation (px)
const $ = (s) => document.querySelector(s), cv = $("#plan"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, vue = { s: 6, ox: 0, oy: 0 };
let S = { noeuds: [], branches: [], pn: [], pb: [] }, choix = -1, tracer = false, passe = [], calc = null;
// Deux squelettes superposés, même fonctionnement : les voies (`noeuds`, `branches`) et la structure
// (`pn`, `pb` : un nœud est un poteau, une branche une poutre). `NO` et `BR` désignent celui qu'on modifie.
let calque = 0, NO, BR, choixN = -1; // choixN : poteau choisi
function pointer() { S.pn = S.pn || []; S.pb = S.pb || []; NO = calque ? S.pn : S.noeuds; BR = calque ? S.pb : S.branches; }
const versE = (p) => [p[0] * vue.s + vue.ox, -p[1] * vue.s + vue.oy], versM = (x, y) => [(x - vue.ox) / vue.s, (vue.oy - y) / vue.s];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- Géométrie d'une branche : demi-chaussée (la plus large des deux côtés, NF P 91-100 tab. 2 note 6) et rangées.
function demi(b) { return Math.max(TYPES[b.g].allee, TYPES[b.d].allee) / 2; }
function repere(b, N = S.noeuds) {
  const A = N[b.a], B = N[b.b], L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1e-9;
  const u = [(B[0] - A[0]) / L, (B[1] - A[1]) / L], n = [-u[1], u[0]];
  return { A, L, u, n, P: (t, o) => [A[0] + u[0] * t + n[0] * o, A[1] + u[1] * t + n[1] * o] };
}
// Chaussée : prolongée à chaque bout jusqu'au bord de la plus large des voies qu'elle y rencontre,
// pour que les voies se rejoignent aux nœuds sans déborder sur les places d'en face.
function debord(b, k) { let e = 0; for (const o of S.branches) if (o !== b && (o.a === k || o.b === k)) e = Math.max(e, demi(o)); return e; }
function chaussee(b) { const r = repere(b), h = demi(b), ea = debord(b, b.a), eb = debord(b, b.b); return [r.P(-ea, -h), r.P(r.L + eb, -h), r.P(r.L + eb, h), r.P(-ea, h)]; }
// Rangée : comme la chaussée, elle va jusqu'au bord de la voie rencontrée à chaque bout.
function bande(b, cote) { const r = repere(b), h = demi(b), s = cote === "g" ? 1 : -1, t = TYPES[b[cote]], ea = debord(b, b.a), eb = debord(b, b.b); return t.prof ? [r.P(-ea, s * h), r.P(r.L + eb, s * h), r.P(r.L + eb, s * (h + t.prof)), r.P(-ea, s * (h + t.prof))] : null; }
// Angles du bâtiment : à un nœud, du côté où deux branches voisines s'ouvrent à plus de 180°, les
// génératrices du fond des deux rangées (le bord de la chaussée s'il n'y a pas de rangée) se
// prolongent jusqu'à leur rencontre. L'angle ferme l'emprise et donne un point où poser un poteau.
function angles() {
  const out = [];
  S.noeuds.forEach((N, k) => {
    const autour = S.branches.filter((b) => b.a === k || b.b === k).map((b) => { const r = repere(b), dep = b.a === k, d = dep ? r.u : [-r.u[0], -r.u[1]]; return { b, d, dep, th: Math.atan2(d[1], d[0]) }; }).sort((x, y) => x.th - y.th);
    if (autour.length < 2) return;
    autour.forEach((i, n) => {
      const j = autour[(n + 1) % autour.length]; let ang = j.th - i.th; if (ang <= 0) ang += 2 * Math.PI;
      if (ang < Math.PI + 0.02 || ang > 2 * Math.PI - 0.02) return;
      // Côté de chaque branche tourné vers l'angle : à gauche de la première en partant du nœud, à droite de la seconde.
      const wi = demi(i.b) + TYPES[i.b[i.dep ? "g" : "d"]].prof, wj = demi(j.b) + TYPES[j.b[j.dep ? "d" : "g"]].prof;
      const A = [N[0] - i.d[1] * wi, N[1] + i.d[0] * wi], B = [N[0] + j.d[1] * wj, N[1] - j.d[0] * wj];
      const det = i.d[0] * j.d[1] - i.d[1] * j.d[0], t = ((B[0] - A[0]) * j.d[1] - (B[1] - A[1]) * j.d[0]) / det, X = [A[0] + t * i.d[0], A[1] + t * i.d[1]];
      // Angle trop aigu : la pointe partirait loin, on la coupe.
      const coupe = !isFinite(t) || Math.hypot(X[0] - N[0], X[1] - N[1]) > 3 * Math.max(wi, wj);
      out.push({ q: coupe ? [N, A, B, B] : [N, A, X, B], x: coupe ? null : X.map((v) => +v.toFixed(3)) });
    });
  });
  return out;
}
// Places d'un côté : calées au milieu de la branche ; en épi, penchées dans le sens de marche (on roule à droite).
function places(b, cote) {
  const t = TYPES[b[cote]]; if (!t.prof) return [];
  const r = repere(b), h = demi(b), s = cote === "g" ? 1 : -1;
  const biais = t.angle > 0 && t.angle < 90 ? (t.prof / Math.tan(t.angle * Math.PI / 180)) * -s : 0;
  // Places calées sur le nœud de départ, au pas de la place ; la rangée court d'un bord de voie à l'autre.
  const k0 = Math.ceil((-debord(b, b.a) - Math.min(0, biais)) / t.pas - 1e-9), k1 = Math.floor((r.L + debord(b, b.b) - Math.max(0, biais)) / t.pas + 1e-9), out = [];
  for (let k = k0; k < k1; k++) { const a = k * t.pas; out.push([r.P(a + biais, s * (h + t.prof)), r.P(a + t.pas + biais, s * (h + t.prof)), r.P(a + t.pas, s * h), r.P(a, s * h)]); }
  return out;
}
// Deux quadrilatères convexes se recouvrent-ils ? (axes séparateurs, avec une tolérance de 5 cm)
function recouvre(p, q) {
  for (const poly of [p, q]) for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], nx = b[1] - a[1], ny = a[0] - b[0], l = Math.hypot(nx, ny) || 1;
    let p0 = Infinity, p1 = -Infinity, q0 = Infinity, q1 = -Infinity;
    for (const v of p) { const d = (v[0] * nx + v[1] * ny) / l; p0 = Math.min(p0, d); p1 = Math.max(p1, d); }
    for (const v of q) { const d = (v[0] * nx + v[1] * ny) / l; q0 = Math.min(q0, d); q1 = Math.max(q1, d); }
    if (p1 - q0 < 0.05 || q1 - p0 < 0.05) return false;
  }
  return true;
}
// Point strictement dans un quadrilatère convexe, à plus de `m` mètres de ses bords.
const dedans = (pt, q, m) => { let s = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4], l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, d = ((b[0] - a[0]) * (pt[1] - a[1]) - (b[1] - a[1]) * (pt[0] - a[0])) / l; if (Math.abs(d) <= m) return false; if (s && Math.sign(d) !== s) return false; s = Math.sign(d); } return true; };
const dans = (pt, q) => { let s = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4], c = (b[0] - a[0]) * (pt[1] - a[1]) - (b[1] - a[1]) * (pt[0] - a[0]); if (Math.abs(c) < 1e-9) continue; if (s && Math.sign(c) !== s) return false; s = Math.sign(c); } return true; };

// ---- Calcul : chaussées, places qui tiennent (hors des autres chaussées et des places déjà posées), emprise.
function calculer() {
  const ch = S.branches.map(chaussee), bandes = [], pl = [], genees = [];
  // Structure : poteaux (nœuds portant une poutre), ceux qui tombent dans une voie, portée la plus longue.
  const pot = S.pn.filter(Boolean);
  const conflits = pot.filter((c) => ch.some((q) => dedans(c, q, 0)));
  const portee = S.pb.reduce((m, b) => Math.max(m, repere(b, S.pn).L), 0);
  S.branches.forEach((b, i) => { for (const c of ["g", "d"]) { const q = bande(b, c); if (q) bandes.push(q); for (const p of places(b, c)) { if (ch.some((r, j) => j !== i && recouvre(p, r))) continue; if (pl.some((o) => o.i !== i && recouvre(p, o.q))) continue; if (pot.some((c) => dedans(c, p, 0.15))) { genees.push(p); continue; } pl.push({ i, q: p }); } } });
  // Emprise : réunion des chaussées et des rangées, mesurée sur une grille de 0,5 m.
  const an = angles(), rects = [...ch, ...bandes, ...an.map((a) => a.q)]; let aire = 0;
  if (rects.length) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const q of rects) for (const p of q) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const bb = rects.map((q) => [Math.min(...q.map((p) => p[0])), Math.min(...q.map((p) => p[1])), Math.max(...q.map((p) => p[0])), Math.max(...q.map((p) => p[1]))]);
    for (let x = x0 + 0.25; x < x1; x += 0.5) for (let y = y0 + 0.25; y < y1; y += 0.5) if (rects.some((q, k) => x >= bb[k][0] && x <= bb[k][2] && y >= bb[k][1] && y <= bb[k][3] && dans([x, y], q))) aire += 0.25;
  }
  calc = { ch, bandes, pl, aire, pot, conflits, genees, angles: an };
  $("#s-structure").textContent = pot.length ? `${pot.length} poteaux · ${portee.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m${conflits.length ? ` · ${conflits.length} en voie` : ""}` : "–";
  $("#s-structure").style.color = conflits.length ? css("--rouge") : "";
  $("#s-places").textContent = pl.length; $("#s-branches").textContent = S.branches.length;
  $("#s-emprise").textContent = aire ? Math.round(aire).toLocaleString("fr-FR") + " m²" : "–";
  $("#s-ratio").textContent = pl.length ? (aire / pl.length).toLocaleString("fr-FR", { maximumFractionDigits: 1 }) + " m²" : "–";
}

// ---- Dessin.
function chemin(q) { q.forEach((p, i) => { const e = versE(p); i ? ctx.lineTo(e[0], e[1]) : ctx.moveTo(e[0], e[1]); }); ctx.closePath(); }
function dessiner() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  // Trame de 2,50 m (5 m quand on recule).
  const g = vue.s < 5 ? 5 : PAS, a = versM(0, H), b = versM(W, 0);
  ctx.strokeStyle = css("--grille"); ctx.lineWidth = 1; ctx.beginPath();
  for (let x = Math.floor(a[0] / g) * g; x < b[0]; x += g) { const e = versE([x, 0])[0]; ctx.moveTo(e, 0); ctx.lineTo(e, H); }
  for (let y = Math.floor(a[1] / g) * g; y < b[1]; y += g) { const e = versE([0, y])[1]; ctx.moveTo(0, e); ctx.lineTo(W, e); }
  ctx.stroke();
  if (!calc) return;
  // Emprise : le contour de la réunion (traits épais recouverts par le plein), puis chaussées et places.
  const tout = [...calc.ch, ...calc.bandes, ...calc.angles.map((a) => a.q)];
  ctx.beginPath(); for (const q of tout) chemin(q);
  ctx.lineJoin = "round"; ctx.strokeStyle = css("--mur"); ctx.lineWidth = Math.max(3, 0.5 * vue.s); ctx.stroke();
  ctx.fillStyle = css("--dalle"); ctx.fill();
  ctx.fillStyle = css("--enrobe"); ctx.beginPath(); for (const q of calc.ch) chemin(q); ctx.fill();
  ctx.fillStyle = css("--place"); ctx.beginPath(); for (const p of calc.pl) chemin(p.q); ctx.fill();
  ctx.strokeStyle = css("--marque"); ctx.lineWidth = Math.max(0.6, 0.1 * vue.s); ctx.beginPath();
  for (const p of calc.pl) { const q = p.q.map(versE); ctx.moveTo(q[3][0], q[3][1]); ctx.lineTo(q[0][0], q[0][1]); ctx.lineTo(q[1][0], q[1][1]); ctx.lineTo(q[2][0], q[2][1]); }
  ctx.stroke();
  // Places qu'un poteau condamne.
  ctx.fillStyle = css("--rouge"); ctx.globalAlpha = 0.28; ctx.beginPath(); for (const q of calc.genees) chemin(q); ctx.fill(); ctx.globalAlpha = 1;
  // Squelette de la structure : poutres et poteaux, en avant quand c'est lui qu'on modifie.
  ctx.globalAlpha = calque ? 1 : 0.55;
  S.pb.forEach((br, i) => {
    const A = versE(S.pn[br.a]), B = versE(S.pn[br.b]), sel = calque && i === choix;
    ctx.strokeStyle = css(calque ? "--os" : "--mur"); ctx.lineWidth = sel ? 4 : calque ? 2 : 1.2;
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
  });
  const c = Math.max(7, 0.5 * vue.s);
  S.pn.forEach((pt, i) => {
    if (!pt) return; const e = versE(pt), sel = calque && i === choixN, o = sel ? 5 : 2;
    ctx.fillStyle = css(calc.conflits.includes(pt) ? "--rouge" : "--mur"); ctx.fillRect(e[0] - c / 2, e[1] - c / 2, c, c);
    if (calque) { ctx.strokeStyle = css("--os"); ctx.lineWidth = sel ? 3 : 2; ctx.strokeRect(e[0] - c / 2 - o, e[1] - c / 2 - o, c + 2 * o, c + 2 * o); }
  });
  // Squelette des voies : axes et nœuds.
  ctx.globalAlpha = calque ? 0.4 : 1;
  S.branches.forEach((br, i) => {
    const A = versE(S.noeuds[br.a]), B = versE(S.noeuds[br.b]), sel = !calque && i === choix;
    ctx.strokeStyle = css("--accent"); ctx.lineWidth = sel ? 3.5 : 1.5; ctx.setLineDash(sel ? [] : [8, 5]);
    ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); ctx.setLineDash([]);
  });
  ctx.globalAlpha = 1;
  if (!calque) S.noeuds.forEach((n, i) => {
    if (!S.branches.some((b) => b.a === i || b.b === i)) return;
    const e = versE(n); ctx.beginPath(); ctx.arc(e[0], e[1], 7, 0, 2 * Math.PI); ctx.fillStyle = css("--fond"); ctx.fill(); ctx.strokeStyle = css("--accent"); ctx.lineWidth = 2.5; ctx.stroke();
  });
  if (geste && geste.fantome) { const A = versE(geste.fantome[0]), B = versE(geste.fantome[1]); ctx.strokeStyle = css(calque ? "--os" : "--accent"); ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke(); }
}
let attente = false;
function rafraichir(recalc = true) { if (recalc) calculer(); if (!attente) { attente = true; requestAnimationFrame(() => { attente = false; dessiner(); }); } }

}

// ---- Historique et enregistrement.
function garder() { passe.push(JSON.stringify(S)); if (passe.length > 60) passe.shift(); $("#b-annuler").disabled = false; }
function enregistrer() { try { localStorage.setItem("parkimo.squelette.2", JSON.stringify(S)); } catch (e) { /* stockage indisponible */ } }
function annuler() { if (!passe.length) return; S = JSON.parse(passe.pop()); pointer(); choix = choixN = -1; $("#b-annuler").disabled = !passe.length; rafraichir(); fiche(); enregistrer(); }

// ---- Aimants : un nœud voisin, sinon le corps d'une branche (le nœud s'y crée), sinon la trame.
function noeudPres(e, sauf = -1) { let m = -1, d = AIMANT; NO.forEach((n, i) => { if (i === sauf || !n || (!calque && !BR.some((b) => b.a === i || b.b === i))) return; const p = versE(n), l = Math.hypot(p[0] - e[0], p[1] - e[1]); if (l < d) { d = l; m = i; } }); return m; }

  BR.forEach((b, i) => { if (b.a === saufNoeud || b.b === saufNoeud) return; const r = repere(b, NO), t = (m[0] - r.A[0]) * r.u[0] + (m[1] - r.A[1]) * r.u[1], o = Math.abs((m[0] - r.A[0]) * r.n[0] + (m[1] - r.A[1]) * r.n[1]); if (t > 0 && t < r.L && o < tol && (!best || o < best.o)) best = { i, o, t: Math.round(t / PAS) * PAS, p: r.P(Math.round(t / PAS) * PAS, 0), L: r.L }; });
  return best && best.t > 0.5 && best.t < best.L - 0.5 ? best : null;
}
// Bout d'une branche tirée depuis `o` : angle au pas de 15°, longueur au pas de la trame.
function aligner(o, m) { const a = Math.round(Math.atan2(m[1] - o[1], m[0] - o[0]) / (Math.PI / 12)) * (Math.PI / 12), l = Math.max(PAS, Math.round(Math.hypot(m[0] - o[0], m[1] - o[1]) / PAS) * PAS); return [o[0] + Math.cos(a) * l, o[1] + Math.sin(a) * l]; }

// Nœud au point `m` : celui qui s'y trouve, un nouveau sur une branche, ou un nouveau libre.
function noeudEn(e, m) { const k = noeudPres(e); if (k >= 0) return k; if (calque) return NO.push(m) - 1; const c = branchePres(m, AIMANT / vue.s); if (c) return couper(c.i, c.p); return NO.push(m) - 1; }

// Trame du stationnement : les lignes qui dessinent les places. Un poteau s'y aimante : à un coin de

function aimantTrame(m) {

  const essai = (p, poids) => { const d = Math.hypot(p[0] - m[0], p[1] - m[1]) * poids; if (d < bd) { bd = d; best = p; } };
  for (const a of calc.angles) if (a.x) essai(a.x, 0.6); // l'angle du bâtiment
  for (const q of [...calc.pl.map((p) => p.q), ...calc.genees]) {
    for (const p of q) essai(p, 0.6);
    essai([(q[0][0] + q[1][0]) / 2, (q[0][1] + q[1][1]) / 2], 0.8);
    for (const [a, b] of [[q[3], q[0]], [q[0], q[1]], [q[1], q[2]]]) { const dx = b[0] - a[0], dy = b[1] - a[1], t = Math.max(0, Math.min(1, ((m[0] - a[0]) * dx + (m[1] - a[1]) * dy) / (dx * dx + dy * dy))); essai([a[0] + dx * t, a[1] + dy * t], 1); }

function cible(e, m, sauf = -1) { const k = noeudPres(e, sauf); return k >= 0 ? { k, p: NO[k].slice() } : { k: -1, p: aimantTrame(m) || m.map((v) => +v.toFixed(2)) }; }
// Poutres depuis un poteau : vers le poteau le plus proche de chaque côté (20 m au plus), le long de
// la voie la plus proche ou en travers.
function porter(k, sens) {
  const p = NO[k]; let u = [1, 0], bd = Infinity, n = 0;
  for (const b of S.branches) { const r = repere(b), t = Math.max(0, Math.min(r.L, (p[0] - r.A[0]) * r.u[0] + (p[1] - r.A[1]) * r.u[1])), q = r.P(t, 0), d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (d < bd) { bd = d; u = r.u; } }
  const d = sens === "long" ? u : [-u[1], u[0]];
  for (const s of [1, -1]) {
    let best = -1, bl = 20.01;
    NO.forEach((q, i) => { if (!q || i === k) return; const x = ((q[0] - p[0]) * d[0] + (q[1] - p[1]) * d[1]) * s, y = Math.abs((q[0] - p[0]) * d[1] - (q[1] - p[1]) * d[0]); if (x > 0.5 && y < 0.6 && x < bl) { bl = x; best = i; } });
    if (best >= 0 && !BR.some((b) => (b.a === k && b.b === best) || (b.a === best && b.b === k))) { BR.push({ a: k, b: best }); n++; }

// ---- Gestes : un doigt, un stylet ou la souris ; deux doigts pour zoomer.
const doigts = new Map(); let geste = null, pince = null;
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener("pointerdown", (ev) => {
  cv.setPointerCapture(ev.pointerId); const e = pos(ev); doigts.set(ev.pointerId, e);
  if (doigts.size === 2) { const [a, b] = [...doigts.values()]; pince = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], v: { ...vue } }; if (geste && geste.avant) { S = JSON.parse(geste.avant); pointer(); calculer(); } geste = null; return; }
  const m = versM(e[0], e[1]), k = noeudPres(e), c = k < 0 ? branchePres(m, Math.max(AIMANT / vue.s, 2)) : null;
  if (tracer) geste = { genre: "trace", e, de: calque ? cible(e, m).p : k >= 0 ? NO[k].slice() : c ? c.p : [Math.round(m[0] / PAS) * PAS, Math.round(m[1] / PAS) * PAS] };
  else if (k >= 0) geste = { genre: "noeud", k, e, avant: JSON.stringify(S) };
  else if (c) geste = { genre: "branche", i: c.i, e, m0: m, a0: NO[BR[c.i].a].slice(), b0: NO[BR[c.i].b].slice(), avant: JSON.stringify(S) };
  else geste = { genre: "vue", e };
});
cv.addEventListener("pointermove", (ev) => {
  if (!doigts.has(ev.pointerId)) return; const e = pos(ev); doigts.set(ev.pointerId, e);
  if (pince && doigts.size === 2) { const [a, b] = [...doigts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = Math.max(1.2, Math.min(40, pince.v.s * d / pince.d)); const wx = (pince.m[0] - pince.v.ox) / pince.v.s, wy = (pince.v.oy - pince.m[1]) / pince.v.s; vue = { s, ox: c[0] - wx * s, oy: c[1] + wy * s }; return rafraichir(false); }
  if (!geste) return; const m = versM(e[0], e[1]);
  if (!geste.bouge && Math.hypot(e[0] - geste.e[0], e[1] - geste.e[1]) < 5) return; geste.bouge = true;
  if (geste.genre === "vue") { vue.ox += e[0] - geste.e[0]; vue.oy += e[1] - geste.e[1]; geste.e = e; return rafraichir(false); }
  if (geste.genre === "trace") { const k = noeudPres(e), c = k < 0 ? branchePres(m, AIMANT / vue.s) : null; geste.fantome = [geste.de, calque ? cible(e, m).p : k >= 0 ? NO[k] : c ? c.p : aligner(geste.de, m)]; return rafraichir(false); }
  if (geste.genre === "noeud") {
    // Le nœud suit le doigt : aimanté à un autre nœud, sinon aligné sur son premier voisin.
    if (calque) { const t = cible(e, m, geste.k); NO[geste.k] = t.p; geste.vers = t.k; return rafraichir(); }
    const autre = noeudPres(e, geste.k), v = BR.find((b) => b.a === geste.k || b.b === geste.k), o = v ? NO[v.a === geste.k ? v.b : v.a] : null;
    NO[geste.k] = autre >= 0 ? NO[autre].slice() : o ? aligner(o, m) : m; geste.vers = autre; return rafraichir();
  }
  if (geste.genre === "branche") { const b = BR[geste.i], dx = Math.round((m[0] - geste.m0[0]) / PAS) * PAS, dy = Math.round((m[1] - geste.m0[1]) / PAS) * PAS; NO[b.a] = [geste.a0[0] + dx, geste.a0[1] + dy]; NO[b.b] = [geste.b0[0] + dx, geste.b0[1] + dy]; return rafraichir(); }
});
function fin(ev) {
  const e = doigts.get(ev.pointerId) || pos(ev); doigts.delete(ev.pointerId);
  if (pince) { if (doigts.size < 2) pince = null; return; }
  const g = geste; geste = null; if (!g) return;
  if (g.genre === "trace") {
    if (g.fantome && Math.hypot(g.fantome[1][0] - g.de[0], g.fantome[1][1] - g.de[1]) >= (calque ? 1 : PAS - 1e-6)) { garder(); const a = noeudEn(g.e, g.de), b = noeudEn(versE(g.fantome[1]), g.fantome[1]); if (a !== b) { BR.push(calque ? { a, b } : { a, b, g: "90", d: "90" }); choix = BR.length - 1; choixN = -1; } }
    // Structure : un simple toucher pose un poteau, aimanté à la trame du stationnement.
    else if (calque && !g.bouge) { const t = cible(g.e, versM(g.e[0], g.e[1])); if (t.k < 0) { garder(); choixN = NO.push(t.p) - 1; } else choixN = t.k; choix = -1; }
  } else if (!g.bouge) {
    const m = versM(e[0], e[1]), k = calque ? noeudPres(e) : -1, c = branchePres(m, Math.max(AIMANT / vue.s, 2));
    choixN = k; choix = k >= 0 ? -1 : g.genre === "branche" ? g.i : c ? c.i : -1;
  }
  else if (g.genre === "noeud") { passe.push(g.avant); $("#b-annuler").disabled = false; if (g.vers >= 0) fusionner(g.vers, g.k); else if (!calque) { const c = branchePres(NO[g.k], AIMANT / vue.s, g.k); if (c) { NO[g.k] = c.p; fusionner(couper(c.i, c.p), g.k); } } choix = -1; choixN = calque ? (g.vers >= 0 ? g.vers : g.k) : -1; }
  else if (g.genre === "branche") { passe.push(g.avant); $("#b-annuler").disabled = false; const b = BR[g.i]; for (const k of [b.a, b.b]) { const v = noeudPres(versE(NO[k]), k); if (v >= 0) fusionner(v, k); } }

cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", fin);
cv.addEventListener("wheel", (ev) => { ev.preventDefault(); const e = pos(ev), m = versM(e[0], e[1]), s = Math.max(1.2, Math.min(40, vue.s * Math.exp(-ev.deltaY * 0.0015))); vue = { s, ox: e[0] - m[0] * s, oy: e[1] + m[1] * s }; rafraichir(false); }, { passive: false });

// ---- Fiche de la branche choisie : ce qui se développe à gauche et à droite de l'axe.
for (const seg of document.querySelectorAll("#fiche .seg")) for (const k of Object.keys(TYPES)) { const b = document.createElement("button"); b.textContent = TYPES[k].nom; b.dataset.t = k; seg.append(b); }
function fiche() {
  const poteau = calque && choixN >= 0 && NO[choixN], b = BR[choix];
  $("#fiche").hidden = !b && !poteau; $("#f-portee").hidden = !poteau;
  for (const l of document.querySelectorAll("#fiche .ligne")) l.hidden = !!calque;
  if (poteau) { const n = BR.filter((x) => x.a === choixN || x.b === choixN).length; $("#f-long").textContent = `Poteau · ${n} poutre${n > 1 ? "s" : ""}${calc.conflits.includes(poteau) ? " · dans une voie" : ""}`; return; }
  if (!b) return;
  if (calque) { $("#f-long").textContent = `Poutre · portée ${repere(b, NO).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m`; return; }
  for (const seg of document.querySelectorAll("#fiche .seg")) for (const x of seg.children) x.setAttribute("aria-pressed", String(b[seg.dataset.cote] === x.dataset.t));
  const n = calc ? calc.pl.filter((p) => p.i === choix).length : 0;
  $("#f-long").textContent = `${repere(b).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m · chaussée ${(2 * demi(b)).toLocaleString("fr-FR")} m · ${n} places`;
}
$("#fiche").addEventListener("click", (ev) => { const x = ev.target.closest(".seg button"), b = S.branches[choix]; if (!x || !b || calque) return; garder(); b[x.parentElement.dataset.cote] = x.dataset.t; rafraichir(); fiche(); enregistrer(); });
$("#f-portee").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-p]"); if (!x || choixN < 0) return;
  garder(); if (!porter(choixN, x.dataset.p)) { passe.pop(); $("#b-annuler").disabled = !passe.length; $("#f-long").textContent = "Aucun poteau en face, à moins de 20 m"; return; }
  rafraichir(); fiche(); enregistrer();
});
$("#b-suppr").addEventListener("click", () => {
  // Un poteau part avec ses poutres.
  if (calque && choixN >= 0) { garder(); const r = BR.filter((b) => b.a !== choixN && b.b !== choixN); BR.length = 0; BR.push(...r); NO[choixN] = null; choixN = -1; rafraichir(); fiche(); enregistrer(); return; }
  if (choix < 0) return; garder(); BR.splice(choix, 1); choix = -1; rafraichir(); fiche(); enregistrer(); });
$("#b-tracer").addEventListener("click", () => { tracer = !tracer; $("#b-tracer").setAttribute("aria-pressed", String(tracer)); cv.style.cursor = tracer ? "crosshair" : "grab"; aide(); });
function aide() {
  $("#aide").textContent = calque
    ? (tracer ? "Touchez pour poser un poteau · tirez pour tracer une poutre" : "Glissez un poteau : il s'aimante aux lignes des places · touchez-le pour porter ses poutres")
    : (tracer ? "Tirez un trait : il s'aimante aux nœuds, aux branches et à la trame" : "Glissez un nœud ou une branche · touchez une branche pour la régler");
}
$("#calques").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-c]"); if (!x) return;
  calque = +x.dataset.c; choix = choixN = -1; pointer(); aide(); for (const y of $("#calques").children) y.setAttribute("aria-pressed", String(y === x)); fiche(); rafraichir(false);
});
$("#b-annuler").addEventListener("click", annuler); $("#b-cadrer").addEventListener("click", cadrer);
addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") { ev.preventDefault(); annuler(); } });

// ---- Départ : le dernier essai, sinon une boucle avec une antenne.
try { const s = JSON.parse(localStorage.getItem("parkimo.squelette.2") || "null"); if (s && s.noeuds && s.branches) S = s; } catch (e) { /* stockage indisponible */ }
const neuf = !S.branches.length;
if (neuf) S = { noeuds: [[0, 0], [60, 0], [60, 15], [0, 15], [90, 0]], branches: [{ a: 0, b: 1, g: "90", d: "90" }, { a: 1, b: 2, g: "aucun", d: "90" }, { a: 2, b: 3, g: "90", d: "90" }, { a: 3, b: 0, g: "aucun", d: "90" }, { a: 1, b: 4, g: "60", d: "45" }], pn: [], pb: [] };
if (neuf) {
  // Structure de l'exemple : trois files (façades et axe des rangées dos à dos), un poteau toutes les trois places.
  [-7.5, 7.5, 22.5].forEach((y, j) => { for (let i = 0; i < 7; i++) { S.pn.push([7.5 * (i + 1), y]); const k = j * 7 + i; if (i) S.pb.push({ a: k - 1, b: k }); if (j) S.pb.push({ a: k - 7, b: k }); } });
}
pointer();

</script>

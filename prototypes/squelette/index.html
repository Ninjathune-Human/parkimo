<!doctype html>
<html lang="fr">
<head>

<title>Parkimo · essai du squelette</title>
<style>
:root { --barre: 82px; --fond: #EEF1EF; --grille: rgba(17,22,20,.07); --label: #111614; --label-2: rgba(17,22,20,.62); --verre: rgba(255,255,255,.78); --trait: rgba(17,22,20,.12); --accent: #007AFF; --dalle: #D9DDD9; --enrobe: #8E9499; --place: #A3A9AE; --marque: #FFFFFF; --mur: #2B3136; --rouge: #FF3B30; --os: #FF9500; --pieton: #3F86C9; --rampe: #C7B594; }
@media (prefers-color-scheme: dark) { :root { --fond: #14181A; --grille: rgba(238,243,240,.07); --label: #EEF3F0; --label-2: rgba(238,243,240,.64); --verre: rgba(30,35,38,.78); --trait: rgba(238,243,240,.14); --accent: #0A84FF; --dalle: #2A3034; --enrobe: #4A5157; --place: #5A6268; --marque: #E9EDEB; --mur: #C9D0CD; --rouge: #FF453A; --pieton: #5AA0E0; --rampe: #8E7C5E; } }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--fond); color: var(--label); font: 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", system-ui, sans-serif; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.verre { background: var(--verre); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); border: 1px solid var(--trait); box-shadow: 0 8px 28px rgba(0,0,0,.10); }
#bilan { position: fixed; left: max(16px, env(safe-area-inset-left)); top: calc(16px + env(safe-area-inset-top)); border-radius: 20px; padding: 12px 16px; min-width: 190px; }
#bilan-det > summary { display: grid; grid-template-columns: 1fr auto auto; column-gap: 12px; align-items: center; cursor: pointer; list-style: none; }
#bilan-det > summary::-webkit-details-marker { display: none; }
#bilan-det > summary h1 { grid-column: 1 / -1; }
#bilan-det > summary::after { content: ""; grid-row: 2; grid-column: 3; width: 8px; height: 8px; border-right: 1.5px solid var(--label-2); border-bottom: 1.5px solid var(--label-2); transform: rotate(-135deg) translate(-2px, -2px); transition: transform .15s; }
#bilan-det:not([open]) > summary::after { transform: rotate(45deg) translate(-2px, -2px); }
#bilan-det .resume { grid-row: 2; grid-column: 2; display: none; font-size: 13px; color: var(--label-2); font-variant-numeric: tabular-nums; }
#bilan-det:not([open]) .resume { display: inline; }
#bilan-det:not([open]) > summary h1 { display: none; } #bilan-det:not([open]) > summary .n { grid-row: 2; font-size: 24px; }
#bilan h1 { margin: 0 0 2px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--label-2); }

#principes summary::after { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--label-2); border-bottom: 1.5px solid var(--label-2); transform: rotate(45deg) translateY(-2px); transition: transform .15s; justify-self: end; }
#principes[open] summary::after { transform: rotate(-135deg) translateY(-2px); }
#l-principes { list-style: none; margin: 4px 0 2px; padding: 0; display: grid; gap: 3px; max-width: 270px; }
#l-principes li { display: grid; grid-template-columns: 1fr auto; gap: 10px; } #l-principes li span { color: var(--label-2); text-align: right; } #l-principes li.non span { color: var(--rouge); }
#bilan dt { color: var(--label-2); } #bilan dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
#barre { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 6px; border-radius: 30px; }

button[aria-pressed="true"], button.plein { background: var(--accent); color: #fff; }
button:disabled { opacity: .35; }
#fiche { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--barre) + env(safe-area-inset-bottom)); border-radius: 22px; padding: 10px 12px; display: grid; gap: 8px; width: min(430px, calc(100vw - 24px)); }
#fiche[hidden] { display: none; }
.ligne[hidden] { display: none; }
#barre .seg { align-self: center; }
#barre .seg button { flex: 1 0 auto; padding: 0 10px; }
/* Écran étroit : les calques ont leur ligne, au-dessus des commandes. La fiche d'une voie, haute, prend leur place le temps du réglage. */
@media (max-width: 760px) {
  :root { --barre: 108px; } #bilan { left: max(8px, env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); padding: 8px 14px; border-radius: 18px; } #bilan-det[open] { max-height: calc(100vh - var(--barre) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom)); overflow-y: auto; }
  #aide.lu { display: none; }
  #barre { bottom: calc(8px + env(safe-area-inset-bottom)); padding: 4px; gap: 4px; } #barre { flex-wrap: wrap; justify-content: space-between; width: calc(100vw - 24px); border-radius: 26px; } #barre .seg { flex: 0 0 100%; } #barre > button { flex: 1; padding: 0 10px; min-height: 40px; }
  body:has(#fiche:not([hidden]) .ligne:not([hidden])) { --barre: 70px; } body:has(#fiche:not([hidden]) .ligne:not([hidden])) #calques { display: none; }
}

#f-mur, #f-trame, #f-escalier, #f-escauto { display: grid; }

#f-portee button, #f-mur button, #f-trame button, #f-escalier button, #f-escauto button { min-height: 40px; padding: 0 6px; font-size: 13px; background: color-mix(in srgb, var(--os) 18%, transparent); border-radius: 12px; }
#fiche .bas button { color: var(--rouge); min-height: 40px; padding: 0 10px; }
#aide { pointer-events: none; position: fixed; left: 50%; transform: translateX(-50%); top: calc(16px + env(safe-area-inset-top)); font-size: 13px; color: var(--label-2); padding: 8px 14px; border-radius: 18px; max-width: calc(100vw - 250px); text-align: center; }
@media (max-width: 760px) { #aide { top: auto; bottom: calc(var(--barre) + env(safe-area-inset-bottom)); max-width: calc(100vw - 24px); } body:has(#fiche:not([hidden])) #aide { display: none; } }

<body>
<canvas id="plan" aria-label="Squelette du parc"></canvas>
<section id="bilan" class="verre" aria-live="polite">
  <details id="bilan-det" open>
  <summary><h1>Essai du squelette</h1><div class="n"><span id="s-places">0</span><small>places</small></div><span id="s-resume" class="resume"></span></summary>
  <dl><dt>Emprise</dt><dd id="s-emprise">–</dd><dt>Par place</dt><dd id="s-ratio">–</dd><dt>Branches</dt><dd id="s-branches">0</dd><dt>Piétons</dt><dd id="s-pietons">–</dd><dt>Rampes</dt><dd id="s-rampes">–</dd><dt>Escaliers</dt><dd id="s-escaliers">–</dd><dt>Structure</dt><dd id="s-structure">–</dd><dt>Contreventement</dt><dd id="s-contrev">–</dd></dl>

  </details>
</section>
<div id="aide" class="verre">Glissez un nœud ou une branche · touchez une branche pour la régler</div>

  <div class="ligne"><span>Gauche</span><div class="seg" data-cote="g"></div></div>
  <div class="ligne"><span>Droite</span><div class="seg" data-cote="d"></div></div>
  <div class="ligne"><span>Piétons</span><div class="seg" data-cote="pieton"><button data-t="auto">Auto</button><button data-t="aucun">Aucune</button><button data-t="g">Gauche</button><button data-t="d">Droite</button></div></div>
  <div class="ligne"><span>Rampe</span><div class="seg" data-cote="rampe"><button data-t="droite">Droite</button><button data-t="demi">Demi-niveau</button><button data-t="voie">Toute la voie</button></div></div>
  <div class="ligne"><span>Sens</span><div class="seg" data-cote="sens"><button data-t="1">Unique</button><button data-t="2">Double</button></div></div>
  <div id="f-portee" hidden><button data-p="long">Poutres le long de la voie</button><button data-p="travers">Poutres en travers</button></div>
  <div id="f-systeme" class="seg" role="group" aria-label="Système porteur" hidden></div>

  <button id="b-tracer" aria-pressed="false">Tracer</button>
  <button id="b-annuler" disabled>Annuler</button>
  <button id="b-cadrer">Cadrer</button>
</nav>
<script>
"use strict";
// ============================================================================
// Essai du squelette : une branche est l'axe d'une voie. De chaque côté viennent la demi-chaussée
// puis, si on le veut, une rangée de places (longitudinales, en épi ou perpendiculaires).
// L'enveloppe de toutes les branches est l'emprise du bâtiment. Prototype d'interaction en
// JavaScript, à part du moteur Rust : il sert à juger l'idée, pas à produire un plan.
// Cotes (charte, décision 8) : entre la norme NF P 91-100 (tab. 2) et le Neufert (p. 272-273), la plus généreuse.
// Les voies sont à double sens : allée de 6,00 m à 90°, bande piétonne comprise (Neufert ; norme au-delà de vingt
// places desservies), et voie sans place de 6,00 m. Places de 2,50 m partout (Neufert). À 60° : profondeur 5,30 m
// (Neufert), allée 4,00 m. À 45° : profondeur 4,80 m et allée 3,50 m (norme, mieux-disante). En long : 5,70 m (Neufert).
// ============================================================================
const TYPES = {
  aucun: { nom: "Voie", allee: 6.0, prof: 0, pas: 0, angle: 0 },
  "0": { nom: "0°", allee: 3.5, prof: 2.5, pas: 5.7, angle: 0 },
  "45": { nom: "45°", allee: 3.5, prof: 4.8, pas: 2.5 / Math.sin(Math.PI / 4), angle: 45 },
  "60": { nom: "60°", allee: 4.0, prof: 5.3, pas: 2.5 / Math.sin(Math.PI / 3), angle: 60 },
  "90": { nom: "90°", allee: 6.0, prof: 5.0, pas: 2.5, angle: 90 },
};
// Systèmes porteurs (charte, section 5 ; sources en section 14). `travees` : nombre de places entre deux appuis ;
// `section` : côté du poteau ou épaisseur du voile ; `portee` : portée nette à ne pas dépasser. `rang` : l'appui
// tient dans la rangée, entre deux travées, et les places se comptent entre nus ; sinon il est au fond de la rangée
// et rien ne tombe dans le plateau.
const SYSTEMES = {
  poteaux: { nom: "Poteaux", travees: [3, 2], section: 0.4, portee: 10, rang: true },
  voiles: { nom: "Voiles", travees: [3, 2], section: 0.2, portee: 7.5, rang: true, voile: true },
  acier: { nom: "Portée acier", travees: [2], section: 0.2, portee: 16.5 },
  beton: { nom: "Portée béton", travees: [3, 2], section: 0.4, portee: 16.5 },
};
const LARGEURS = [2.5, 2.4, 2.3]; // largeur d'une place à 90°, par ordre de préférence (décision 5)
const RETRAIT = 0.65; // un poteau à 0,65 m de l'allée ne demande aucune surlargeur (NF P 91-100, tab. 3)
const PAS = 2.5, AIMANT = 16; // trame des longueurs (m), rayon d'aimantation (px)
const $ = (s) => document.querySelector(s), cv = $("#plan"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, vue = { s: 6, ox: 0, oy: 0 };
let S = { noeuds: [], branches: [], pn: [], pb: [] }, choix = -1, tracer = false, modeEmp = false, passe = [], calc = null;
// Deux squelettes superposés, même fonctionnement : les voies (`noeuds`, `branches`) et la structure
// (`pn`, `pb` : un nœud est un poteau, une branche une poutre). `NO` et `BR` désignent celui qu'on modifie.
let actif = 0, calque = 0, NO, BR, choixN = -1; // actif : 0 voies, 1 poteaux, 2 escaliers ; calque : le squelette de la structure est en main ; choixN : poteau choisi
// ---- Rampes, par typologie. Une rampe est une brique posée dans une rangée, comme la rampe « le long des
// allées » du moteur (src/ouvrage/plateau.rs, en_rangee) dont elle reprend le gabarit : une voie de 3,25 m contre
// l'allée (Neufert, sens unique), abordée et quittée en S depuis la voie de l'allée, à 1,50 m de son bord. Chaque
// S est fait de deux arcs de 6,50 m de rayon à l'axe et balaie 2,00 m de part et d'autre : c'est l'épure de
// giration. La rampe prend donc, dans la rangée, sa longueur plus un S à chaque bout (8,46 m) : les places
// y disparaissent, et aucun poteau ne tient dans la voie ni dans les épures. On roule à droite : la rampe d'une
// rangée de droite se parcourt dans le sens de la voie, celle d'une rangée de gauche à rebours.
// Elle garde sa place sur le plan (son centre) ; à chaque calcul elle s'aimante à la rangée la plus proche qui
// peut la recevoir, au pas de 2,50 m. Deux rampes dont les rangées se touchent sont couplées.
// Droite : un étage de 2,80 m à 15 % (Neufert), soit 18,70 m, arrondis à 20 m. Demi-niveau : 1,40 m à 15 %, 10 m.
// Rampe branchée (charte, décision 7) : une voie du squelette peut être une rampe. D'équerre sur une voie, elle s'y
// branche directement, sans S ni épure : 3,25 m en sens unique, 6,50 m en double sens (Neufert p. 274-276), sans
// place ni bande piétonne. Sa pente se mesure sur sa longueur propre, entre les bords des voies qu'elle relie.
const RAMPES = { droite: { nom: "Rampe droite", long: 20, haut: 2.8 }, demi: { nom: "Rampe de demi-niveau", long: 10, haut: 1.4 } };
const PENTE = 0.15; // pente à ne pas dépasser (Neufert ; plafond NF P 91-100 : 18 %)
const GIR = { r: 6.5, h: 2.0, hs: 1.5, voie: 3.25 }; // rayon à l'axe, demi-largeur balayée en courbe, demi-voie droite, voie de rampe
GIR.dv = GIR.hs + GIR.voie / 2; GIR.phi = Math.acos(1 - GIR.dv / (2 * GIR.r)); GIR.s = 2 * GIR.r * Math.sin(GIR.phi);
let choixR = -1; // rampe choisie
// ---- Circulations verticales (règlement de sécurité des ERP, type PS : articles PS 13 et PS 24). Un escalier est un
// noyau posé dans une rangée, comme une rampe : il y prend deux places (5,00 m : volées de 0,90 m au moins et sas de
// 3 m² au moins). L'escalier principal en prend quatre : il loge, accolés, deux ascenseurs et leur sas (5 m² au moins,
// 1,50 m de large). La porte est au milieu de l'escalier, côté allée. Toute place en est à 40 m au plus si elle est
// entre deux escaliers, 25 m en cul-de-sac ; un cul-de-sac de 25 m au plus qui mène à deux escaliers garde 40 m.
// La distance se mesure du centre de la place, par les circulations piétonnes, jusqu'à la porte.
const ESCALIER = { long: 5, dist: 40, impasse: 25 };
let choixE = -1; // escalier choisi
// Un noyau de longueur L se loge dans la rangée la plus proche du point `p` qui peut le recevoir, calé sur une ligne
// de place (au pas de 2,50 m dans une rangée en épi).
function loger(p, L, B, D) {
  let best = null;
  S.branches.forEach((b, i) => { for (const c of ["g", "d"]) {
    const t = TYPES[b[c]]; if (t.prof < 4 || b.rampe) continue;
    const r = repere(b), s = c === "g" ? 1 : -1, h = demi(b), al = (q) => (q[0] - r.A[0]) * r.u[0] + (q[1] - r.A[1]) * r.u[1];
    const a0 = Math.max(al(B[i].a[c][2]), al(B[i].a[c][3])), a1 = Math.min(al(B[i].b[c][2]), al(B[i].b[c][3])) - L; if (a1 < a0 - 1e-6) continue;
    const vise = al(p) - L / 2, lignes = D ? D[i][c].pl.map((q) => q.lo).filter((x) => x >= a0 - 1e-6 && x <= a1 + 1e-6) : [];
    const a = lignes.length ? lignes.reduce((m, x) => (Math.abs(x - vise) < Math.abs(m - vise) ? x : m)) : Math.min(a1, Math.max(a0, Math.round(vise / PAS) * PAS));
    const v = s * ((p[0] - r.A[0]) * -r.u[1] + (p[1] - r.A[1]) * r.u[0]), d = Math.hypot(v - (h + t.prof / 2), al(p) - (a + L / 2));
    if (best && d >= best.d) continue;
    best = { d, i, c, s, a, L, h, r, prof: t.prof, corps: [r.P(a, s * h), r.P(a + L, s * h), r.P(a + L, s * (h + t.prof)), r.P(a, s * (h + t.prof))] };
  } });
  if (best && best.d < 12) return best;
  return { i: -1, L, hors: true, corps: [[p[0] - L / 2, p[1] - 2.5], [p[0] + L / 2, p[1] - 2.5], [p[0] + L / 2, p[1] + 2.5], [p[0] - L / 2, p[1] + 2.5]] };
}
// Desserte : distance de chaque place à l'escalier le plus proche, et sa limite. Le réseau suit les voies (sauf les
// rampes) ; chaque escalier s'y rattache au droit de sa porte. La place rejoint la bande piétonne de sa voie (son axe
// s'il n'y en a pas), la suit, puis gagne la porte.
// Traversées : d'une voie à sa voisine parallèle, un piéton passe entre les places, tous les CROIX mètres, en ligne droite d'une bande
// à l'autre. Un escalier dessert ainsi les travées voisines, pas seulement sa propre voie. Une voie parallèle intercalée les interdit.
const CROIX = 5; let croixMemo = { cle: "", liste: [] };
function traversees(R, bout, bande) {
  const B = S.branches, X = [], ok = B.map((b) => !b.rampe), nu = (k, i) => ({ d: (R[k].A[0] - R[i].A[0]) * -R[i].u[1] + (R[k].A[1] - R[i].A[1]) * R[i].u[0], par: Math.abs(R[k].u[0] * R[i].u[1] - R[k].u[1] * R[i].u[0]) <= 0.02 });
  for (let i = 0; i < B.length; i++) for (let j = i + 1; j < B.length; j++) {
    if (!ok[i] || !ok[j]) continue; const ri = R[i], rj = R[j], e = nu(j, i); if (!e.par || Math.abs(e.d) < 4 || Math.abs(e.d) > 20) continue;
    if (B.some((_, k) => { if (k === i || k === j || !ok[k]) return false; const f = nu(k, i); return f.par && f.d * e.d > 0 && Math.abs(f.d) < Math.abs(e.d) - 1; })) continue;
    const lo = Math.min(...bout[i]), hi = Math.max(...bout[i]), lj = Math.min(...bout[j]), hj = Math.max(...bout[j]);
    for (let a = lo + CROIX / 2; a <= hi; a += CROIX) {
      const P = ri.P(a, bande(i)), b = (P[0] - rj.A[0]) * rj.u[0] + (P[1] - rj.A[1]) * rj.u[1]; if (b < lj - 1e-6 || b > hj + 1e-6) continue;
      const Q = rj.P(b, bande(j)); X.push({ i, a, j, b, w: Math.hypot(P[0] - Q[0], P[1] - Q[1]) });
    }
  }
  return X;
}
function desservir(escaliers, pl) {

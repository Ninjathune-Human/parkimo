<script>
"use strict";
// ============================================================================
// Essai du squelette : une branche est l'axe d'une voie. De chaque côté viennent la demi-chaussée
// puis, si on le veut, une rangée de places (longitudinales, en épi ou perpendiculaires).
// L'enveloppe de toutes les branches est l'emprise du bâtiment. Prototype d'interaction en
// JavaScript, à part du moteur Rust : il sert à juger l'idée, pas à produire un plan.
// Cotes : NF P 91-100, tableau 2 (allée, profondeur de rangée, largeur de place), places de 2,50 m à 90°.
// ============================================================================
const TYPES = {
  aucun: { nom: "Voie", allee: 5.5, prof: 0, pas: 0, angle: 0 },
  "0": { nom: "0°", allee: 3.5, prof: 2.5, pas: 5.0, angle: 0 },
  "45": { nom: "45°", allee: 3.5, prof: 4.8, pas: 2.2 / Math.sin(Math.PI / 4), angle: 45 },
  "60": { nom: "60°", allee: 4.0, prof: 5.15, pas: 2.25 / Math.sin(Math.PI / 3), angle: 60 },

const PAS = 2.5, AIMANT = 16; // trame des longueurs (m), rayon d'aimantation (px)
const $ = (s) => document.querySelector(s), cv = $("#plan"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, vue = { s: 6, ox: 0, oy: 0 };
let S = { noeuds: [], branches: [], pn: [], pb: [] }, choix = -1, tracer = false, passe = [], calc = null;
// Deux squelettes superposés, même fonctionnement : les voies (`noeuds`, `branches`) et la structure
// (`pn`, `pb` : un nœud est un poteau, une branche une poutre). `NO` et `BR` désignent celui qu'on modifie.
let calque = 0, NO, BR, choixN = -1; // choixN : poteau choisi
let ficheTrame = true; // calque Poteaux, rien de choisi : la fiche de la trame est ouverte ; un toucher hors du dessin la replie
const dansDessin = (m) => !!calc && [...calc.ch, ...calc.bandes].some((q) => dans(m, q));
function pointer() { S.pn = S.pn || []; S.pb = S.pb || []; NO = calque ? S.pn : S.noeuds; BR = calque ? S.pb : S.branches; }
const versE = (p) => [p[0] * vue.s + vue.ox, -p[1] * vue.s + vue.oy], versM = (x, y) => [(x - vue.ox) / vue.s, (vue.oy - y) / vue.s];
const css = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// ---- Géométrie d'une branche : demi-chaussée (la plus large des deux côtés, NF P 91-100 tab. 2 note 6) et rangées.
// Une voie bordée de places d'un seul côté prend l'allée de ces places, pas la largeur d'une voie seule.
function demi(b) { const g = TYPES[b.g], d = TYPES[b.d]; return (g.prof && d.prof ? Math.max(g.allee, d.allee) : g.prof ? g.allee : d.prof ? d.allee : g.allee) / 2; }
function repere(b, N = S.noeuds) {
  const A = N[b.a], B = N[b.b], L = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1e-9;

}
// Bande piétonne : 0,80 m pris dans la largeur de la voie, d'un côté de l'axe, le long de son bord.
// Elle ne déplace ni la chaussée ni les places.
// Réglage d'une voie : « auto » (le côté est choisi par la logique d'ensemble, voir bandesAuto), « g », « d » ou « aucun ».
let COTE = new Map(); // côté retenu pour les voies en « auto »
const BANDE = 0.8, bandeDe = (b) => (b.pieton === "auto" ? COTE.get(b) || "aucun" : b.pieton || "aucun"), pw = (b, c) => (c === "g" || c === "d") && bandeDe(b) === c ? BANDE : 0;
// ---- Nœuds. Autour d'un nœud, les branches sont prises dans l'ordre ; entre deux voisines s'ouvre un secteur.
// Dans un secteur, les bords de même rang des deux branches (bord de chaussée, bord de bande piétonne, fond de
// rangée) se prolongent jusqu'à leur rencontre : chaussées, bandes et rangées s'y coupent l'une sur l'autre,
// sans recouvrement ni vide. Secteur rentrant (moins de 180°) : la rangée de la branche la plus longue garde le
// coin, l'autre s'arrête sur son fond. Bords parallèles, pointe trop longue ou branche trop courte : chaque
// branche est coupée d'équerre au nœud et une cale ferme le secteur.

    if (!autour.length) return;

      const j = autour[(n + 1) % autour.length]; let ang = j.th - i.th; if (ang <= 1e-9) ang += 2 * Math.PI;
      const ci = i.dep ? "g" : "d", cj = j.dep ? "d" : "g", hi = demi(i.b), hj = demi(j.b);
      const oi = [hi, hi - pw(i.b, ci), hi + TYPES[i.b[ci]].prof], oj = [hj, hj - pw(j.b, cj), hj + TYPES[j.b[cj]].prof]; // bord de chaussée, bord intérieur de bande, fond de rangée
      const ni = [-i.d[1], i.d[0]], nj = [j.d[1], -j.d[0]], det = i.d[0] * j.d[1] - i.d[1] * j.d[0];
      const A = (o) => [N[0] + ni[0] * o, N[1] + ni[1] * o], B = (o) => [N[0] + nj[0] * o, N[1] + nj[1] * o];
      const X = (a, b) => { const p = A(a), q = B(b), t = ((q[0] - p[0]) * j.d[1] - (q[1] - p[1]) * j.d[0]) / det; return [p[0] + t * i.d[0], p[1] + t * i.d[1]]; }; // bord de i à l'écart a, bord de j à l'écart b

        if (Math.hypot(xe[0] - N[0], xe[1] - N[1]) <= 3 * Math.max(oi[2], oj[2]) + 1 && le(xe, i) < i.L - 0.5 && le(xe, j) < j.L - 0.5) {

          if (ang > Math.PI + 0.02) coins.push({ x: xe.map((v) => +v.toFixed(3)), q: [N, [xe[0] + i.d[0], xe[1] + i.d[1]], xe, [xe[0] + j.d[0], xe[1] + j.d[1]]] });
        }

      bouts[i.i][i.dep ? "a" : "b"][ci] = pi; bouts[j.i][j.dep ? "a" : "b"][cj] = pj;
      tour.push(pi[0]); if (!joint) tour.push(pj[0]);

      return { lie: joint || Math.abs(ang - Math.PI) < 0.1, pietons: [pw(i.b, ci) ? i.i : -1, pw(j.b, cj) ? j.i : -1].filter((v) => v >= 0) };
    });

    carrefours.push({ autour, sect });

}
// Places d'un côté : calées au milieu de la branche ; en épi, penchées dans le sens de marche (on roule à droite).
const biaisDe = (t, s) => t.angle > 0 && t.angle < 90 ? (t.prof / Math.tan(t.angle * Math.PI / 180)) * -s : 0;

  const t = TYPES[b[cote]]; if (!t.prof) return [];

  const al = rangee.map((p) => (p[0] - r.A[0]) * r.u[0] + (p[1] - r.A[1]) * r.u[1]), k0 = Math.floor((Math.min(...al) - Math.abs(biais)) / t.pas) - 1, k1 = Math.ceil((Math.max(...al) + Math.abs(biais)) / t.pas) + 1, out = [];

// Un polygone tient-il dans un quadrilatère convexe ? (2 cm de tolérance au bord)

function recouvre(p, q) {
  for (const poly of [p, q]) for (let i = 0; i < poly.length; i++) {
    const a = poly[i], b = poly[(i + 1) % poly.length], nx = b[1] - a[1], ny = a[0] - b[0], l = Math.hypot(nx, ny); if (!l) continue;

    for (const v of q) { const d = (v[0] * nx + v[1] * ny) / l; q0 = Math.min(q0, d); q1 = Math.max(q1, d); }

// Point strictement dans un quadrilatère convexe, à plus de `m` mètres de ses bords.
const dedans = (pt, q, m) => { let s = 0; for (let i = 0; i < 4; i++) { const a = q[i], b = q[(i + 1) % 4], l = Math.hypot(b[0] - a[0], b[1] - a[1]); if (!l) continue; const d = ((b[0] - a[0]) * (pt[1] - a[1]) - (b[1] - a[1]) * (pt[0] - a[0])) / l; if (Math.abs(d) <= m) return false; if (s && Math.sign(d) !== s) return false; s = Math.sign(d); } return true; };

// ---- Calcul : chaussées, places qui tiennent (hors des autres chaussées et des places déjà posées), emprise.
// Tant que la trame est automatique (`S.auto`), la structure est refaite à chaque changement des voies :
// elle s'adapte à chaque branche. Les travées pleines dont les deux poteaux n'ont pas bougé restent pleines.
function calculer() {
  if (S.auto) {
    const murs = S.pb.filter((b) => b.plein && S.pn[b.a] && S.pn[b.b]).map((b) => [S.pn[b.a], S.pn[b.b]]), pres = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1]) < 0.05;

    for (const b of S.pb) { const A = S.pn[b.a], B = S.pn[b.b]; if (murs.some((m) => (pres(m[0], A) && pres(m[1], B)) || (pres(m[0], B) && pres(m[1], A)))) b.plein = true; }

}
function mesurer() {
  bandesAuto();

  const ch = [...S.branches.map((_, i) => [B[i].a.d[0], B[i].b.d[0], B[i].b.g[0], B[i].a.g[0]]), ...geo.nd], bandes = [...geo.cales], pl = [], genees = [];

    autour.forEach((x, n) => {

  for (const b of S.branches) { const r = repere(b), t = Math.max(0, Math.min(r.L, (p[0] - r.A[0]) * r.u[0] + (p[1] - r.A[1]) * r.u[1])), q = r.P(t, 0), d = Math.hypot(p[0] - q[0], p[1] - q[1]); if (d < bd) { bd = d; u = r.u; } }
  const d = sens === "long" ? u : [-u[1], u[0]];
  for (const s of [1, -1]) {
    let best = -1, bl = 20.01;
    NO.forEach((q, i) => { if (!q || i === k) return; const x = ((q[0] - p[0]) * d[0] + (q[1] - p[1]) * d[1]) * s, y = Math.abs((q[0] - p[0]) * d[1] - (q[1] - p[1]) * d[0]); if (x > 0.5 && y < 0.6 && x < bl) { bl = x; best = i; } });
    if (best >= 0 && !BR.some((b) => (b.a === k && b.b === best) || (b.a === best && b.b === k))) { BR.push({ a: k, b: best }); n++; }
  }
  return n;
}

// Trame automatique, quelle que soit la forme. Sur chaque voie, des files en travers partent du bout des
// rangées (tête d'îlot) puis reviennent toutes les trois places ; la dernière travée s'ajuste. Chaque file
// pose un poteau sur la génératrice du fond de chaque rangée, ou au bord de la chaussée si ce bord est une
// façade. Les angles du bâtiment ferment les files. Poutres : le long des génératrices et en travers des voies.
function trame() {
  const pts = [], poutres = [], rects = [...calc.ch, ...calc.bandes];
  const ajoute = (p, dirs) => {
    // Un poteau à moins d'un mètre d'un autre ne se pose pas ; au même point (rangées dos à dos), il partage ses poutres.
    let k = pts.findIndex((o) => Math.hypot(o.p[0] - p[0], o.p[1] - p[1]) < 1);
    if (k >= 0 && Math.hypot(pts[k].p[0] - p[0], pts[k].p[1] - p[1]) > 0.05) return;
    if (k < 0) { if (calc.ch.some((q) => dedans(p, q, 0.02)) || calc.pl.some((o) => dedans(p, o.q, 0.15))) return; k = pts.push({ p: p.map((v) => +v.toFixed(3)), dirs: [] }) - 1; }
    pts[k].dirs.push(...dirs);
  };
  S.branches.forEach((b, i) => {
    const r = repere(b), h = demi(b), n = [-r.u[1], r.u[0]];
    const cotes = ["g", "d"].map((c) => { const t = TYPES[b[c]], s = c === "g" ? 1 : -1, ks = new Set(); for (const o of calc.pl) if (o.i === i && o.c === c) { ks.add(o.q.k); ks.add(o.q.k + 1); } return { t, s, ks }; });
    const rg = cotes.filter((x) => x.ks.size); if (!rg.length && cotes.some((x) => x.t.prof)) return;
    const pas = rg.length ? rg[0].t.pas : PAS, a0 = rg.length ? Math.max(...rg.map((x) => Math.min(...x.ks) * x.t.pas)) : 0, a1 = rg.length ? Math.min(...rg.map((x) => Math.max(...x.ks) * x.t.pas)) : r.L;
    if (a1 - a0 < pas) return;
    // Files comptées depuis le même bout quel que soit le sens de la branche, pour que deux voies parallèles tombent d'accord.
    const inv = r.u[0] < -1e-9 || (Math.abs(r.u[0]) < 1e-9 && r.u[1] < 0), as = [];
    for (let d = 0; d < a1 - a0 - 1e-6; d += 3 * pas) as.push(d);
    if (as.length > 1 && a1 - a0 - as[as.length - 1] < 1.5 * pas) as[as.length - 1] = a1 - a0; else as.push(a1 - a0);
    for (const x of cotes) for (const d of as) {
      const a = inv ? a1 - d : a0 + d, dirs = [{ d: r.u, tol: 0.3 }, { d: [-r.u[0], -r.u[1]], tol: 0.3 }, { d: [-x.s * n[0], -x.s * n[1]], tol: pas / 2 + 0.1 }];
      if (x.t.prof) { const k = Math.round(a / x.t.pas); if (x.ks.has(k)) ajoute(r.P(k * x.t.pas + biaisDe(x.t, x.s), x.s * (h + x.t.prof)), dirs); }
      else if (!rects.some((q) => dans(r.P(a, x.s * (h + 0.3)), q))) ajoute(r.P(a, x.s * h), dirs);
    }
  });
  for (const a of calc.angles) if (a.x) ajoute(a.x, [1, 3].map((m) => { const v = [a.q[m][0] - a.x[0], a.q[m][1] - a.x[1]], l = Math.hypot(v[0], v[1]); return l > 0.01 ? { d: [v[0] / l, v[1] / l], tol: 0.3 } : null; }).filter(Boolean));
  pts.forEach((o, k) => { for (const { d, tol } of o.dirs) {
    let best = -1, bx = 20.01;
    pts.forEach((q, j) => { if (j === k) return; const x = (q.p[0] - o.p[0]) * d[0] + (q.p[1] - o.p[1]) * d[1], y = Math.abs((q.p[0] - o.p[0]) * d[1] - (q.p[1] - o.p[1]) * d[0]); if (x > 0.5 && y <= tol && x < bx) { bx = x; best = j; } });
    if (bx > (tol > 0.3 ? 20 : 15)) best = -1; // 15 m au plus le long d'une génératrice, 20 m en travers d'une voie
    if (best >= 0 && !poutres.some((b) => (b.a === k && b.b === best) || (b.a === best && b.b === k))) poutres.push({ a: k, b: best });
  } });

}

// ---- Gestes : un doigt, un stylet ou la souris ; deux doigts pour zoomer.
const doigts = new Map(); let geste = null, pince = null;
const pos = (ev) => { const r = cv.getBoundingClientRect(); return [ev.clientX - r.left, ev.clientY - r.top]; };
cv.addEventListener("pointerdown", (ev) => {
  cv.setPointerCapture(ev.pointerId); const e = pos(ev); doigts.set(ev.pointerId, e);
  if (doigts.size === 2) { const [a, b] = [...doigts.values()]; pince = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), m: [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], v: { ...vue } }; if (geste && geste.avant) { S = JSON.parse(geste.avant); pointer(); calculer(); } geste = null; return; }
  const m = versM(e[0], e[1]), k = noeudPres(e), c = k < 0 ? branchePres(m, Math.max(AIMANT / vue.s, 2)) : null;
  if (tracer) geste = { genre: "trace", e, de: calque ? cible(e, m).p : k >= 0 ? NO[k].slice() : c ? c.p : [Math.round(m[0] / PAS) * PAS, Math.round(m[1] / PAS) * PAS] };
  else if (k >= 0) geste = { genre: "noeud", k, e, avant: JSON.stringify(S), p0: NO[k].slice(), suite: calque ? [] : suiveurs(k) };
  else if (c) geste = { genre: "branche", i: c.i, e, m0: m, a0: NO[BR[c.i].a].slice(), b0: NO[BR[c.i].b].slice(), avant: JSON.stringify(S), suite: calque ? [] : [...suiveurs(BR[c.i].a), ...suiveurs(BR[c.i].b)].filter((x) => x.n !== BR[c.i].a && x.n !== BR[c.i].b) };
  else geste = { genre: "vue", e };
});
cv.addEventListener("pointermove", (ev) => {
  if (!doigts.has(ev.pointerId)) return; const e = pos(ev); doigts.set(ev.pointerId, e);
  if (pince && doigts.size === 2) { const [a, b] = [...doigts.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]), c = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = Math.max(1.2, Math.min(40, pince.v.s * d / pince.d)); const wx = (pince.m[0] - pince.v.ox) / pince.v.s, wy = (pince.v.oy - pince.m[1]) / pince.v.s; vue = { s, ox: c[0] - wx * s, oy: c[1] + wy * s }; return rafraichir(false); }
  if (!geste) return; const m = versM(e[0], e[1]);
  if (!geste.bouge && Math.hypot(e[0] - geste.e[0], e[1] - geste.e[1]) < 5) return; geste.bouge = true;
  if (calque && S.auto && geste.genre !== "trace") S.auto = false; // un poteau ou une poutre glissé à la main : la trame ne suit plus les voies
  if (geste.genre === "vue") { vue.ox += e[0] - geste.e[0]; vue.oy += e[1] - geste.e[1]; geste.e = e; return rafraichir(false); }
  if (geste.genre === "trace") { const k = noeudPres(e), c = k < 0 ? branchePres(m, AIMANT / vue.s) : null; geste.fantome = [geste.de, calque ? cible(e, m).p : k >= 0 ? NO[k] : c ? c.p : aligner(geste.de, m)]; return rafraichir(false); }
  if (geste.genre === "noeud") {
    // Le nœud suit le doigt : aimanté à un autre nœud, sinon aligné sur son premier voisin.
    if (calque) { const t = cible(e, m, geste.k); NO[geste.k] = t.p; geste.vers = t.k; return rafraichir(); }
    // Les parties qu'il emmène le suivent du même déplacement ; il ne s'aimante ni ne s'aligne sur elles.
    const suit = (n) => geste.suite.some((x) => x.n === n), pres = noeudPres(e, geste.k), autre = pres >= 0 && suit(pres) ? -1 : pres;
    const v = BR.find((b) => (b.a === geste.k && !suit(b.b)) || (b.b === geste.k && !suit(b.a))), o = v ? NO[v.a === geste.k ? v.b : v.a] : null;
    NO[geste.k] = autre >= 0 ? NO[autre].slice() : o ? aligner(o, m) : m; geste.vers = autre;
    for (const x of geste.suite) NO[x.n] = [x.p[0] + NO[geste.k][0] - geste.p0[0], x.p[1] + NO[geste.k][1] - geste.p0[1]];
    return rafraichir();
  }
  if (geste.genre === "branche") {
    const b = BR[geste.i], [dx, dy] = calque ? [Math.round((m[0] - geste.m0[0]) / PAS) * PAS, Math.round((m[1] - geste.m0[1]) / PAS) * PAS] : aimantVoie(geste, m);
    NO[b.a] = [geste.a0[0] + dx, geste.a0[1] + dy]; NO[b.b] = [geste.b0[0] + dx, geste.b0[1] + dy];
    for (const x of geste.suite) NO[x.n] = [x.p[0] + dx, x.p[1] + dy]; // les parties pendantes suivent
    return rafraichir();
  }
});
function fin(ev) {
  const e = doigts.get(ev.pointerId) || pos(ev); doigts.delete(ev.pointerId);
  if (pince) { if (doigts.size < 2) pince = null; return; }
  const g = geste; geste = null; if (!g) return;
  if (g.genre === "trace") {
    if (g.fantome && Math.hypot(g.fantome[1][0] - g.de[0], g.fantome[1][1] - g.de[1]) >= (calque ? 1 : PAS - 1e-6)) { garder(); const a = noeudEn(g.e, g.de), b = noeudEn(versE(g.fantome[1]), g.fantome[1]); if (calque) S.auto = false; if (a !== b) { BR.push(calque ? { a, b } : { a, b, g: "90", d: "90" }); if (!calque) BR[BR.length - 1].pieton = "auto"; choix = BR.length - 1; choixN = -1; } }
    // Structure : un simple toucher pose un poteau, aimanté à la trame du stationnement.
    // Hors du dessin, le toucher désélectionne tout et replie la fiche.
    else if (calque && !g.bouge) { const m = versM(g.e[0], g.e[1]), t = cible(g.e, m); choix = -1; if (t.k >= 0) choixN = t.k; else if (dansDessin(t.p) || dansDessin(m)) { garder(); S.auto = false; choixN = NO.push(t.p) - 1; } else { choixN = -1; ficheTrame = false; } }
    else if (!g.bouge) choix = choixN = -1;
  } else if (!g.bouge) {
    const m = versM(e[0], e[1]), k = calque ? noeudPres(e) : -1, c = branchePres(m, Math.max(AIMANT / vue.s, 2));
    choixN = k; choix = k >= 0 ? -1 : g.genre === "branche" ? g.i : c ? c.i : -1;
    if (calque && k < 0 && choix < 0) ficheTrame = dansDessin(m); // rien touché : dans le dessin, la fiche de la trame ; dehors, tout se replie
  }
  else if (g.genre === "noeud") { passe.push(g.avant); $("#b-annuler").disabled = false; if (g.vers >= 0) fusionner(g.vers, g.k); else if (!calque) { const c = branchePres(NO[g.k], AIMANT / vue.s, g.k); if (c) { NO[g.k] = c.p; fusionner(couper(c.i, c.p), g.k); } } choix = -1; choixN = calque ? (g.vers >= 0 ? g.vers : g.k) : -1; }
  else if (g.genre === "branche") { passe.push(g.avant); $("#b-annuler").disabled = false; const b = BR[g.i]; for (const k of [b.a, b.b]) { const v = noeudPres(versE(NO[k]), k); if (v >= 0) fusionner(v, k); } }
  rafraichir(); fiche(); enregistrer();
}
cv.addEventListener("pointerup", fin); cv.addEventListener("pointercancel", fin);
cv.addEventListener("wheel", (ev) => { ev.preventDefault(); const e = pos(ev), m = versM(e[0], e[1]), s = Math.max(1.2, Math.min(40, vue.s * Math.exp(-ev.deltaY * 0.0015))); vue = { s, ox: e[0] - m[0] * s, oy: e[1] + m[1] * s }; rafraichir(false); }, { passive: false });

// ---- Fiche de la branche choisie : ce qui se développe à gauche et à droite de l'axe.
for (const seg of document.querySelectorAll('#fiche .seg:not([data-cote="pieton"])')) for (const k of Object.keys(TYPES)) { const b = document.createElement("button"); b.textContent = TYPES[k].nom; b.dataset.t = k; seg.append(b); }
function fiche() {
  const poteau = calque && choixN >= 0 && NO[choixN], b = BR[choix];
  const libre = !!calque && !b && !poteau && ficheTrame; // rien de choisi dans la structure : la fiche est celle de la trame entière
  $("#fiche").hidden = !b && !poteau && !libre; $("#f-portee").hidden = !poteau; $("#f-mur").hidden = !calque || !!poteau || !b; $("#f-trame").hidden = !libre; $("#b-suppr").hidden = libre;
  for (const l of document.querySelectorAll("#fiche .ligne")) l.hidden = !!calque;
  if (libre) { const n = calc ? calc.pot.length : 0; $("#b-trame").setAttribute("aria-pressed", String(!!S.auto)); $("#f-long").textContent = (n ? `${n} poteau${n > 1 ? "x" : ""}` : "Aucun poteau") + (S.auto ? " · suit les voies" : " · à la main"); return; }
  if (poteau) { const n = BR.filter((x) => x.a === choixN || x.b === choixN).length; $("#f-long").textContent = `Poteau · ${n} poutre${n > 1 ? "s" : ""}${calc.conflits.includes(poteau) ? " · dans une voie" : ""}`; return; }
  if (!b) return;
  if (calque) { $("#b-plein").setAttribute("aria-pressed", String(!!b.plein)); $("#f-long").textContent = `${b.plein ? "Travée pleine" : "Poutre"} · portée ${repere(b, NO).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m`; return; }
  for (const seg of document.querySelectorAll("#fiche .seg")) for (const x of seg.children) x.setAttribute("aria-pressed", String((b[seg.dataset.cote] || "aucun") === x.dataset.t));
  const n = calc ? calc.pl.filter((p) => p.i === choix).length : 0;
  $("#f-long").textContent = `${repere(b).L.toLocaleString("fr-FR", { maximumFractionDigits: 1 })} m · chaussée ${(2 * demi(b)).toLocaleString("fr-FR")} m · ${n} places`;
}
$("#fiche").addEventListener("click", (ev) => { const x = ev.target.closest(".seg button"), b = S.branches[choix]; if (!x || !b || calque) return; garder(); b[x.parentElement.dataset.cote] = x.dataset.t; rafraichir(); fiche(); enregistrer(); });
$("#f-portee").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-p]"); if (!x || choixN < 0) return;
  garder(); S.auto = false; if (!porter(choixN, x.dataset.p)) { passe.pop(); $("#b-annuler").disabled = !passe.length; $("#f-long").textContent = "Aucun poteau en face, à moins de 20 m"; return; }
  rafraichir(); fiche(); enregistrer();
});
$("#b-trame").addEventListener("click", () => { garder(); S.auto = !S.auto; choix = choixN = -1; rafraichir(); fiche(); enregistrer(); });
// Une travée remplie en maçonnerie contrevente le bâtiment dans son sens.
$("#b-plein").addEventListener("click", () => { const b = calque && BR[choix]; if (!b) return; garder(); if (b.plein) delete b.plein; else b.plein = true; rafraichir(); fiche(); enregistrer(); });
$("#b-suppr").addEventListener("click", () => {
  // Un poteau part avec ses poutres.
  if (calque && (choixN >= 0 || choix >= 0)) { garder(); S.auto = false; }
  if (calque && choixN >= 0) { const r = BR.filter((b) => b.a !== choixN && b.b !== choixN); BR.length = 0; BR.push(...r); NO[choixN] = null; choixN = -1; rafraichir(); fiche(); enregistrer(); return; }
  if (choix < 0) return; if (!calque) garder(); BR.splice(choix, 1); choix = -1; rafraichir(); fiche(); enregistrer(); });
$("#b-tracer").addEventListener("click", () => { tracer = !tracer; $("#b-tracer").setAttribute("aria-pressed", String(tracer)); cv.style.cursor = tracer ? "crosshair" : "grab"; aide(); });
function aide() {
  $("#aide").textContent = calque
    ? (tracer ? "Touchez pour poser un poteau · tirez pour tracer une poutre" : "Glissez un poteau : il s'aimante aux lignes des places · touchez-le pour porter ses poutres")
    : (tracer ? "Tirez un trait : il s'aimante aux nœuds, aux branches et à la trame" : "Glissez un nœud ou une branche · touchez une branche pour la régler");
}
$("#calques").addEventListener("click", (ev) => {
  const x = ev.target.closest("button[data-c]"); if (!x) return;
  calque = +x.dataset.c; choix = choixN = -1; ficheTrame = true; pointer(); aide(); for (const y of $("#calques").children) y.setAttribute("aria-pressed", String(y === x)); fiche(); rafraichir(false);
});
$("#b-annuler").addEventListener("click", annuler); $("#b-cadrer").addEventListener("click", cadrer);
addEventListener("keydown", (ev) => { if ((ev.ctrlKey || ev.metaKey) && ev.key === "z") { ev.preventDefault(); annuler(); } });

// ---- Départ : le dernier essai, sinon une boucle avec une antenne.
try { const s = JSON.parse(localStorage.getItem("parkimo.squelette.5") || "null"); if (s && s.noeuds && s.branches) S = s; } catch (e) { /* stockage indisponible */ }
const neuf = !S.branches.length;
// Essai enregistré avant la logique d'ensemble : ses bandes posées à la main ou absentes passent en « auto ».
if (!S.v) { for (const b of S.branches) if (b.pieton !== "aucun") b.pieton = "auto"; S.v = 2; }
if (neuf) S = { noeuds: [[0, 0], [60, 0], [60, 15], [0, 15], [90, 0]], branches: [{ a: 0, b: 1, g: "90", d: "90", pieton: "auto" }, { a: 1, b: 2, g: "aucun", d: "90", pieton: "auto" }, { a: 2, b: 3, g: "90", d: "90", pieton: "auto" }, { a: 3, b: 0, g: "aucun", d: "90", pieton: "auto" }, { a: 1, b: 4, g: "60", d: "45", pieton: "auto" }], pn: [], pb: [] };
if (S.auto === undefined) S.auto = true; // un essai enregistré avant la trame automatique la reçoit
pointer();
new ResizeObserver(taille).observe(cv); taille(); calculer();
// Structure de l'exemple : la trame automatique, et trois travées pleines qui contreventent dans les deux sens.
if (neuf) { const x0 = Math.min(...S.pn.map((p) => p[0])), y0 = Math.min(...S.pn.map((p) => p[1])); for (const b of S.pb) { const A = S.pn[b.a], B = S.pn[b.b]; if ((A[0] === x0 && B[0] === x0 && Math.min(A[1], B[1]) >= 2.5 && Math.max(A[1], B[1]) <= 17.5) || (A[1] === y0 && B[1] === y0 && Math.max(A[0], B[0]) <= 2.5)) b.plein = true; } calculer(); }

[package]
name = "trame"
version = "0.1.0"
edition = "2021"
description = "Moteur d'étude de capacité (parking) : géométrie robuste et optimisation en temps réel"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
geo = { version = "0.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
